<title>만남 배분기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ─────────────────────────────────────────────
   색·글자 — 라이트가 기본, 다크는 토큰만 다시 씀
   ───────────────────────────────────────────── */
:root{
  --bg:#eceeed; --surface:#fafbfa; --sunk:#e2e6e4; --raise:#ffffff;
  --ink:#1b201f; --ink2:#4d5654; --ink3:#828c89;
  --line:#d3d8d5; --line2:#c0c7c3;
  --accent:#0d5f5a; --accent-ink:#ffffff; --accent-soft:#d9e8e6; --accent-line:#9dc4c0;
  --gold:#8d6412; --gold-soft:#f2e7ca; --gold-line:#d8bf82;
  --bad:#9c3627; --bad-soft:#f4dfda; --bad-line:#d9a89e;
  --ok:#2c6440; --ok-soft:#dcebe0;
  /* 만남 행렬 — 단계가 한눈에 갈라져야 한다. 색조를 통째로 바꾼다 */
  --hm0:#e4e8e6; --hm1:#2f8a83; --hm2:#d9971a; --hm3:#b03726;
  --shadow:0 1px 0 rgba(27,32,31,.05), 0 2px 8px rgba(27,32,31,.06);
  --myeongjo:"Apple Myungjo","AppleMyungjo","Nanum Myeongjo","Batang","바탕","Songti SC",serif;
  --gothic:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121716; --surface:#1a201f; --sunk:#232a29; --raise:#252d2c;
    --ink:#e7ecea; --ink2:#a6b1ad; --ink3:#78837f;
    --line:#2f3836; --line2:#3d4745;
    --accent:#4fb3aa; --accent-ink:#0c1a19; --accent-soft:#16302e; --accent-line:#2c5a56;
    --gold:#d2a34c; --gold-soft:#312717; --gold-line:#5a4620;
    --bad:#df8171; --bad-soft:#331d19; --bad-line:#5e332b;
    --ok:#6cbd84; --ok-soft:#17301f;
    --hm0:#2e3836; --hm1:#3f9c94; --hm2:#d2a34c; --hm3:#cf5340;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#121716; --surface:#1a201f; --sunk:#232a29; --raise:#252d2c;
  --ink:#e7ecea; --ink2:#a6b1ad; --ink3:#78837f;
  --line:#2f3836; --line2:#3d4745;
  --accent:#4fb3aa; --accent-ink:#0c1a19; --accent-soft:#16302e; --accent-line:#2c5a56;
  --gold:#d2a34c; --gold-soft:#312717; --gold-line:#5a4620;
  --bad:#df8171; --bad-soft:#331d19; --bad-line:#5e332b;
  --ok:#6cbd84; --ok-soft:#17301f;
  --hm0:#2e3836; --hm1:#3f9c94; --hm2:#d2a34c; --hm3:#cf5340;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--gothic); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

/* ── 뼈대 ── */
.wrap{max-width:1180px; margin:0 auto; padding:0 20px 120px; display:grid; grid-template-columns:150px minmax(0,1fr); gap:34px}
@media (max-width:880px){ .wrap{grid-template-columns:1fr; gap:0; padding:0 14px 90px} }

header.top{
  position:sticky; top:0; z-index:40; background:var(--bg);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1180px; margin:0 auto; padding:12px 20px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.brand{font-family:var(--myeongjo); font-size:21px; letter-spacing:.02em; white-space:nowrap}
.brand b{font-weight:400}
.tag{font-size:12.5px; color:var(--ink3); letter-spacing:.01em}
.top-sp{flex:1}
.top-acts{display:flex; gap:6px; align-items:center; flex-wrap:wrap}

/* ── 왼쪽 레일 ── */
nav.rail{position:sticky; top:62px; align-self:start; padding-top:30px; display:flex; flex-direction:column; gap:1px}
@media (max-width:880px){
  nav.rail{position:sticky; top:53px; flex-direction:row; gap:2px; padding:8px 0; background:var(--bg); z-index:30; overflow-x:auto; border-bottom:1px solid var(--line)}
}
.rail a{
  display:flex; align-items:baseline; gap:8px; text-decoration:none; color:var(--ink3);
  padding:6px 9px; border-radius:5px; font-size:13.5px; white-space:nowrap;
}
.rail a:hover{color:var(--ink); background:var(--sunk)}
.rail a.on{color:var(--ink); background:var(--sunk); font-weight:600}
.rail a .n{font-family:var(--mono); font-size:11px; color:var(--ink3); font-weight:400}
.rail a.on .n{color:var(--accent)}
.rail .rail-note{font-size:11.5px; color:var(--ink3); padding:14px 9px 0; line-height:1.5}
@media (max-width:880px){ .rail .rail-note{display:none} }

main{min-width:0; padding-top:30px; display:flex; flex-direction:column; gap:44px}

section{scroll-margin-top:70px}
.sec-h{display:flex; align-items:baseline; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.sec-h h2{font-family:var(--myeongjo); font-size:23px; font-weight:400; letter-spacing:.01em}
.sec-h .sub{font-size:13px; color:var(--ink3)}
.sec-h .sp{flex:1}

/* ── 카드·표면 ── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow)}
.pad{padding:16px 18px}

/* ── 단추 ── */
.btn{
  background:var(--surface); border:1px solid var(--line2); color:var(--ink2);
  padding:5px 11px; border-radius:6px; cursor:pointer; font-size:13px; line-height:1.5;
  transition:background .12s, color .12s, border-color .12s;
}
.btn:hover{background:var(--sunk); color:var(--ink)}
.btn:active{transform:translateY(.5px)}
.btn[disabled]{opacity:.4; cursor:default}
.btn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.12); background:var(--accent); color:var(--accent-ink)}
.btn.sm{padding:3px 8px; font-size:12px}
.btn.warn{color:var(--bad); border-color:var(--bad-line)}
.btn.warn:hover{background:var(--bad-soft); color:var(--bad)}

/* ── 명단 붙여넣기 ── */
.paste{
  border:1.5px dashed var(--line2); border-radius:10px; background:var(--surface);
  padding:26px 22px; text-align:center;
}
.paste .kbd-line{font-family:var(--myeongjo); font-size:20px; margin-bottom:6px}
.paste p{margin:0; color:var(--ink3); font-size:13.5px}
kbd{
  font-family:var(--mono); font-size:12px; background:var(--sunk); border:1px solid var(--line2);
  border-bottom-width:2px; border-radius:4px; padding:1px 5px; color:var(--ink2);
}
textarea.sheet{
  width:100%; min-height:120px; margin-top:14px; padding:10px 12px;
  border:1px solid var(--line2); border-radius:7px; background:var(--raise);
  font-family:var(--mono); font-size:12.5px; line-height:1.55; resize:vertical;
}

/* ── 열 역할 ── */
.cols{display:flex; flex-wrap:wrap; gap:7px}
.col{
  display:flex; align-items:center; gap:7px; background:var(--sunk);
  border:1px solid var(--line); border-radius:7px; padding:4px 5px 4px 10px; font-size:13px;
}
.col b{font-weight:600; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.col select{
  background:var(--surface); border:1px solid var(--line2); border-radius:5px;
  padding:2px 5px; font-size:12px; cursor:pointer;
}
.col.is-name{background:var(--accent-soft); border-color:var(--accent-line)}
.col.is-party{background:var(--gold-soft); border-color:var(--gold-line)}

/* ── 사람 칩 ── */
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{
  border:1px solid var(--line2); background:var(--raise); color:var(--ink);
  border-radius:20px; padding:2.5px 11px; font-size:13px; cursor:pointer; line-height:1.55;
  transition:opacity .12s, background .12s;
}
.chip:hover{background:var(--sunk)}
.chip.off{opacity:.4; text-decoration:line-through; background:transparent}
.chip .pt{color:var(--gold); font-size:11px; margin-left:4px; font-family:var(--mono)}

/* ── 세션 카드 ── */
.sess{display:flex; flex-direction:column; gap:14px}
.scard{background:var(--surface); border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow); overflow:hidden}
.scard.lock{border-color:var(--accent-line)}
.shead{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.shead input.nm{
  background:transparent; border:none; border-bottom:1px dashed transparent;
  font-family:var(--myeongjo); font-size:18px; padding:1px 2px; width:min(220px,42vw); min-width:90px;
}
.shead input.nm:hover{border-bottom-color:var(--line2)}
.shead input.nm:focus{outline:none; border-bottom-color:var(--accent)}
.sbody{padding:12px 14px; display:flex; flex-direction:column; gap:11px}
.row{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.lbl{font-size:12px; color:var(--ink3); letter-spacing:.04em; min-width:74px}
.num{
  width:56px; background:var(--raise); border:1px solid var(--line2); border-radius:5px;
  padding:3px 7px; font-family:var(--mono); font-size:13px; text-align:center;
}
select.pick{background:var(--raise); border:1px solid var(--line2); border-radius:5px; padding:3px 7px; font-size:13px; cursor:pointer}

/* 4단 세그먼트 */
.seg{display:inline-flex; border:1px solid var(--line2); border-radius:6px; overflow:hidden; background:var(--raise)}
.seg button{
  border:none; background:transparent; color:var(--ink3); cursor:pointer;
  padding:2.5px 9px; font-size:12px; border-right:1px solid var(--line);
}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--sunk); color:var(--ink)}
.seg button.on{background:var(--accent); color:var(--accent-ink); font-weight:600}
/* '무시'가 켜진 것처럼 보이면 안 된다 — 아무 일도 안 하는 자리다 */
.seg button.on.lv0{background:var(--sunk); color:var(--ink3); font-weight:400}
.seg button.on.lv3{background:var(--gold); color:#fff}
:root[data-theme="dark"] .seg button.on.lv3{color:#1a1305}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .seg button.on.lv3{color:#1a1305} }

.attrgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:2px 22px}
.attrrow{display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:3px 0}
.attrrow .an{font-size:13px; min-width:88px; color:var(--ink3)}
.attrrow.act .an{color:var(--ink); font-weight:600}

.foldbtn{background:none; border:none; color:var(--accent); cursor:pointer; font-size:12.5px; padding:2px 0; text-decoration:underline; text-underline-offset:3px}
.fold{padding:8px 0 2px}

/* ── 배정 결과 ── */
.teams{display:grid; grid-template-columns:repeat(auto-fill,minmax(152px,1fr)); gap:10px}
.team{border:1px solid var(--line); border-radius:8px; background:var(--surface); overflow:hidden}
.team h4{
  font-size:11.5px; letter-spacing:.09em; color:var(--ink3); font-weight:600;
  padding:5px 10px; background:var(--sunk); border-bottom:1px solid var(--line);
  display:flex; justify-content:space-between; gap:6px;
}
.team h4 .cnt{font-family:var(--mono); font-weight:400}
.team h4 input.rlab{
  background:transparent; border:none; border-bottom:1px dashed var(--line2);
  font:inherit; color:var(--ink); width:6.5em; padding:0 1px; letter-spacing:.02em;
}
.team h4 input.rlab:hover{border-bottom-color:var(--ink3)}
.team h4 input.rlab:focus{outline:none; border-bottom-color:var(--accent)}
@media print{ .team h4 input.rlab{border-bottom:none} }
.team .bmark{
  font-size:11px; color:var(--gold); background:var(--gold-soft);
  padding:3px 10px; border-bottom:1px solid var(--line); letter-spacing:.01em;
}
.team .bmark b{font-family:var(--mono); font-weight:700}
.team .bmark i{font-style:normal; opacity:.65; font-size:9px; padding-right:1px}
.team ul{list-style:none; margin:0; padding:6px 10px 8px}
.team li{display:flex; align-items:baseline; gap:6px; padding:1.5px 0; font-size:13.5px}
.team li .who-b{
  background:none; border:none; padding:0; cursor:pointer; text-align:left;
  border-bottom:1px dashed transparent; line-height:1.5;
}
.team li .who-b:hover{border-bottom-color:var(--line2)}
.team li .who-b.pinned{color:var(--gold); font-weight:600; border-bottom-color:var(--gold-line)}
.team li .who-b.dragging{opacity:.4}
.team[data-drop]{transition:box-shadow .12s, background .12s}
.team.over{box-shadow:0 0 0 2px var(--accent); background:var(--accent-soft)}
@media print{ .team.over{box-shadow:none; background:var(--surface)} }
@media print{ .team li .who-b{border-bottom:none} }
.team li .mk{font-family:var(--mono); font-size:10.5px; padding:0 4px; border-radius:3px; letter-spacing:.02em}
.mk.a{background:var(--accent-soft); color:var(--accent)}
.mk.b{background:var(--gold-soft); color:var(--gold)}
.mk.c{background:var(--bad-soft); color:var(--bad)}

.balbar{display:flex; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--ink3); padding-top:2px}
.pill{
  display:inline-flex; align-items:center; border-radius:20px; padding:1.5px 9px;
  font-size:12px; border:1px solid var(--line2); background:var(--raise);
}
.pill .sw{display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:5px}
.pill.ok{background:var(--ok-soft); border-color:transparent; color:var(--ok)}
.pill.warn{background:var(--gold-soft); border-color:transparent; color:var(--gold)}
.pill.bad{background:var(--bad-soft); border-color:transparent; color:var(--bad)}
.pill .v{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ── 진단 ── */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:9px; overflow:hidden}
.stat{background:var(--surface); padding:13px 15px}
.stat .k{font-size:11.5px; letter-spacing:.05em; color:var(--ink3)}
.stat .v{font-family:var(--mono); font-size:26px; font-variant-numeric:tabular-nums; line-height:1.25; letter-spacing:-.01em}
.stat .v small{font-size:13px; color:var(--ink3); font-family:var(--gothic); letter-spacing:0}
.stat .d{font-size:12px; color:var(--ink3)}
.stat.good .v{color:var(--ok)} .stat.warn .v{color:var(--gold)} .stat.bad .v{color:var(--bad)}

.hmwrap{overflow:auto; max-width:100%; padding-bottom:4px}
table.hm{border-collapse:separate; border-spacing:1px; font-family:var(--gothic)}
table.hm td,table.hm th{padding:0; border:none}
table.hm th.rowh{
  text-align:right; padding-right:7px; font-weight:400; color:var(--ink3);
  font-size:11px; white-space:nowrap; position:sticky; left:0; z-index:1; background:var(--surface);
}
table.hm th.colh{
  writing-mode:vertical-rl; font-weight:400; color:var(--ink3);
  font-size:10.5px; height:56px; vertical-align:bottom; padding-bottom:4px; white-space:nowrap;
}
table.hm td.cell{width:15px; height:15px; border-radius:2px}
.h0{background:var(--hm0)} .h1{background:var(--hm1)}
.h2{background:var(--hm2)} .h3{background:var(--hm3)}
.hme{width:15px; height:15px; background:transparent}
/* 십자 강조 — 세로줄이 누구인지 눈으로 따라갈 수 있게 */
table.hm td.cell.xh{box-shadow:0 0 0 1.5px var(--ink)}
table.hm th.xh{color:var(--ink); font-weight:700}
#hm-read{font-variant-numeric:tabular-nums}

table.tbl{width:100%; border-collapse:collapse; font-size:13px}
table.tbl th{
  text-align:left; font-size:11.5px; letter-spacing:.05em; color:var(--ink3);
  font-weight:600; padding:6px 9px; border-bottom:1px solid var(--line2); white-space:nowrap;
}
table.tbl td{padding:5px 9px; border-bottom:1px solid var(--line); vertical-align:top}
table.tbl th.n{text-align:right}
table.tbl td.n{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right}
table.tbl tr:last-child td{border-bottom:none}
.scrollx{overflow-x:auto}

.note{font-size:12.5px; color:var(--ink3); line-height:1.6}
.warnbox{border-left:3px solid var(--bad); background:var(--bad-soft); padding:9px 13px; border-radius:0 7px 7px 0; font-size:13px; color:var(--ink)}
.okbox{border-left:3px solid var(--ok); background:var(--ok-soft); padding:9px 13px; border-radius:0 7px 7px 0; font-size:13px}
.empty{color:var(--ink3); font-size:13.5px; padding:16px 2px}

/* 토스트 */
#toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px);
  background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:7px; font-size:13.5px;
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:90; box-shadow:var(--shadow);
}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

/* 고정 방 편집 */
.fixroom{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 0; border-bottom:1px dashed var(--line)}
.fixroom:last-child{border-bottom:none}
.fixroom .who{display:flex; gap:4px; flex-wrap:wrap; flex:1; min-width:160px}
.mini{
  border:1px solid var(--line2); background:var(--raise); border-radius:16px;
  padding:1px 9px; font-size:12.5px; cursor:pointer;
}
.mini.sel{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.mini.dim{opacity:.35}
.mini.bias-up{background:var(--gold-soft); border-color:var(--gold-line); color:var(--gold); font-weight:600}
.mini.bias-dn{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent); font-weight:600}

@media print{
  header.top,nav.rail,.top-acts,.paste,.noprint{display:none !important}
  body{background:#fff; color:#000; font-size:11pt}
  .wrap{display:block; padding:0; max-width:none}
  main{padding:0; gap:22px}
  .card,.team,.scard{box-shadow:none; border-color:#bbb; break-inside:avoid}
  section{break-before:page}
  section:first-of-type{break-before:auto}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>만남</b> 배분기</div>
    <div class="tag" id="hdr-state">명단을 기다립니다</div>
    <div class="top-sp"></div>
    <div class="top-acts">
      <button class="btn sm pri" id="b-shuffle">전체 다시 섞기</button>
      <button class="btn sm" id="b-undo" title="Ctrl+Z">되돌리기</button>
      <button class="btn sm" id="b-copy">결과 복사</button>
      <button class="btn sm" id="b-cloud" style="display:none">온라인 저장</button>
      <button class="btn sm" id="b-backup">설정 복사</button>
      <button class="btn sm" id="b-print">인쇄</button>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="rail" id="rail">
    <a href="#s-roster"><span class="n">1</span> 명단</a>
    <a href="#s-sessions"><span class="n">2</span> 세션</a>
    <a href="#s-result"><span class="n">3</span> 배정표</a>
    <a href="#s-rooms"><span class="n">4</span> 숙박</a>
    <a href="#s-diag"><span class="n">5</span> 진단</a>
    <div class="rail-note">
      바꾸면 곧바로 다시 배정됩니다.<br>저장할 것은 없습니다.<br><br>
      <kbd>Ctrl</kbd>+<kbd>V</kbd> 명단 붙여넣기<br>
      <kbd>Ctrl</kbd>+<kbd>Z</kbd> 되돌리기
    </div>
  </nav>

  <main>
    <!-- 1 명단 -->
    <section id="s-roster">
      <div class="sec-h">
        <h2>명단</h2>
        <span class="sub" id="roster-sub"></span>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════
   만남 배분기 — 워크샵 세션·숙박 배정
   전부 이 파일 안에서 돈다. 서버도, 통신도, 외부 라이브러리도 없다.
   ═══════════════════════════════════════════════════════════ */

/* ── 무작위: 씨앗을 주면 늘 같은 결과가 나온다 ── */
function rng(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const ri = (r,n)=> Math.floor(r()*n);
function shuffled(arr, r){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=ri(r,i+1); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* ── 표 붙여넣기 해석 (구글 시트는 탭, 엑셀·CSV는 쉼표) ── */
function splitRow(line, d){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=ch;
    }
    else if(ch==='"') q=true;
    else if(ch===d){ out.push(cur); cur=''; }
    else cur+=ch;
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function parseTable(text){
  const lines = text.replace(/\r\n?/g,'\n').split('\n').filter(l=>l.trim()!=='');
  if(!lines.length) return null;
  const d = lines[0].indexOf('\t')>=0 ? '\t' : (lines[0].indexOf(',')>=0 ? ',' : '\t');
  const rows = lines.map(l=>splitRow(l,d));
  const w = Math.max.apply(null, rows.map(r=>r.length));
  rows.forEach(r=>{ while(r.length<w) r.push(''); });
  return rows;
}

const RE_NAME  = /이름|성명|성함|참가자|참석자|닉네임|별명|name/i;
const RE_PARTY = /일행|동행|동반|동료|지인|가족|부부|커플|같이|함께|그룹|조원|팀원|group|party|companion|guest|with/i;
const RE_GEND  = /성별|성$|gender|sex/i;

/* ═══ 상태 ═══
   사람은 이름으로 기억한다. 명단을 다시 붙여넣어도 어긋나지 않는다. */
const LV_W   = [0, 1, 4, 20];        // 무시 · 보통 · 중요 · 필수
const LV_NM  = ['무시','보통','중요','필수'];
const MEET_W = [0, 1, 3, 10];
const PARTY_PEN = 2000;
/* 조 크기로 메우기.
   선형으로 밀고 이차로 막는 짝은 쓰지 않는다 — 같은 열에 걸린 '필수' 분산(20)이
   비례 쪽으로 더 세게 당겨서 선형 항이 묻힌다. 대신 **목표 자체를 기울인다**:
   조의 몫을 인원 L 이 아니라 L + TILT·(L − 평균) 로 잡는다.
   이차라서 몰림은 여전히 막히고, 목표가 큰 조 쪽으로 가 있으니 방향은 확실하다.
   29명·6조(5,5,5,5,5,4)에서 X 16명이면 5인조 2.9명 · 4인조 1.3명이 목표다
   (비례로만 두면 2.8 · 2.2 라 차이가 거의 없다). */
const BIAS_W = 20, BIAS_TILT = 2;
/* 불리함이 누적되지 않게. 조 크기로 메우는 것만으로는 모자란다 —
   1 이 둘인데 3 이 하나도 없는 조가 나올 수 있고, 그 조의 1 은
   큰 조에 갔다는 것 말고는 아무 도움을 못 받는다.
   불리한 사람이 있는 조에는 유리한 사람이 적어도 하나 있어야 한다. */
const HELP_PEN = 45;
/* 방은 둘뿐이라 한 번 잘못 묶으면 밤새 그대로다.
   이미 만난 사이도, 같은 소속·설계팀도 사실상 금지로 둔다. */
const GUARD_PEN = 800, ROOM_MEET = 400;
/* 사람이 직접 고른 짝. 싫다는 것은 사실상 금지, 좋다는 것은 되도록.
   되도록(1500)은 자동 규칙들(만난 사이 400 + 같은 소속 800)을 합친 것보다 커야 한다 —
   사람이 직접 말한 희망이 우리가 넣은 어림짐작에 밀리면 안 된다.
   성별과 '같은 방 안 됨' 은 여전히 이긴다. */
const AVOID_PEN = 3000, PREFER_BONUS = 1500;

let S = blankState();
function blankState(){
  return {
    v: 1,
    headers: [], rows: [], roles: [],
    raw: '', hasHeader: true,
    out: {},                 // 아예 안 오는 사람
    genderCol: -1,
    sessions: [],
    rooms: { fixed: [], odd: 'single', allowParty: false, absent: {}, count: true, seed: 7, list: null, guardNames: [], avoid: [], prefer: [], labels: {} },
    seedBase: 20250814
  };
}

/* ── 저장·되돌리기 ── */
const KEY = 'mixer.v1';
let undoStack = [];
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(stripDerived(S))); }catch(e){} }
function stripDerived(st){
  const c = JSON.parse(JSON.stringify(st));
  return c;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return false;
    const o = JSON.parse(raw);
    if(!o || !o.v) return false;
    S = Object.assign(blankState(), o);
    S.rooms = Object.assign(blankState().rooms, o.rooms||{});
    return true;
  }catch(e){ return false; }
}
/** 사용자가 한 일은 전부 이걸 거친다 — 되돌릴 수 있게. */
function act(fn){
  undoStack.push(JSON.stringify(stripDerived(S)));
  if(undoStack.length>60) undoStack.shift();
  fn();
  save(); recompute(); render();
}
function undo(){
  if(!undoStack.length){ toast('되돌릴 것이 없습니다'); return; }
  S = Object.assign(blankState(), JSON.parse(undoStack.pop()));
  save(); recompute(); render();
  toast('되돌렸습니다');
}
let toastT = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('on'), 1900);
}

/* ═══ 사람 ═══ */
let PEOPLE = [];      // [{name, party, vals:[열별 값]}]
let PIDX = new Map(); // 이름 → 자리
function buildPeople(){
  PEOPLE = []; PIDX = new Map();
  if(!S.rows.length) return;
  let nameCol = S.roles.indexOf('name');
  if(nameCol < 0) nameCol = 0;
  const seen = new Map();
  for(const row of S.rows){
    let nm = (row[nameCol]||'').trim();
    if(!nm) continue;
    if(seen.has(nm)){ const k = seen.get(nm)+1; seen.set(nm,k); nm = nm+' ('+k+')'; }
    else seen.set(nm,1);
    const pc = S.roles.indexOf('party');
    const party = pc>=0 ? (row[pc]||'').trim() : '';
    PEOPLE.push({ name:nm, party, vals:row.slice() });
    PIDX.set(nm, PEOPLE.length-1);
  }
}
/* 동행 여부는 열에 적혀 있는 값이 아니라 파생된 것이다.
   가상의 열 번호를 하나 주면 값처럼 다뤄져서 분산·기울기·도움 규칙이 그대로 먹는다. */
const PARTY_CI = -2;
/* 이름은 늘 가나다 순으로 보여준다 — 서른 명 중에서 눈으로 찾아야 하므로.
   속의 차례(못 박은 자리)는 건드리지 않고 그릴 때만 정렬한다. */
const byName = (a,b)=> String(a).localeCompare(String(b), 'ko');
const sortNames = (arr)=> arr.slice().sort(byName);
const valOf = (p, ci)=>{
  if(ci === PARTY_CI) return p.party ? '동행' : '본인';
  const v=(p.vals[ci]||'').trim(); return v===''? '—' : v;
};
const attrCols = ()=> S.roles.map((r,i)=>r==='attr'?i:-1).filter(i=>i>=0);
const activeNames = ()=> PEOPLE.filter(p=>!S.out[p.name]).map(p=>p.name).sort(byName);

/* ═══ 세션 ═══ */
let sidSeq = 1;
function newSession(name){
  const s = { id:'s'+(sidSeq++)+'_'+Math.floor(Math.random()*1e6), name:name||'세션',
              mode:'size', size:5, count:6, absent:{}, meet:3, attrs:{}, locked:false,
              seed: 1000+Math.floor(Math.random()*90000), teams:null };
  return s;
}
function seedSessions(){
  S.sessions = [ newSession('세션 1'), newSession('세션 2'), newSession('해커톤'), newSession('세션 4') ];
}
function attendees(sess){ return activeNames().filter(n=>!sess.absent[n]); }
function teamSizes(n, sess){
  if(n<=0) return [];
  let k = sess.mode==='count' ? (sess.count|0) : Math.max(1, Math.round(n/Math.max(2,sess.size|0)));
  k = Math.max(1, Math.min(k, n));
  const base = Math.floor(n/k), rem = n%k;
  const out=[]; for(let i=0;i<k;i++) out.push(base + (i<rem?1:0));
  return out;
}

/* ═══ 배정 엔진 ═══
   비용을 정해 두고, 짝을 바꿔가며 비용이 낮은 자리를 찾는다(담금질). */
function buildCtx(names, meet, N, opt){
  const n = names.length;
  const loc = names.map(nm=>PIDX.get(nm));
  const M = new Int32Array(n*n);
  for(let a=0;a<n;a++) for(let b=a+1;b<n;b++){
    const v = meet[loc[a]*N + loc[b]];
    M[a*n+b]=v; M[b*n+a]=v;
  }
  const party = names.map(nm=> PEOPLE[PIDX.get(nm)].party || '');
  // 같은 값이면 한 방에 두지 않을 열들 (소속·설계팀 같은 것)
  const guards = (opt.guards || []).map(ci=>{
    const idOf = new Map();
    return names.map(nm=>{
      const v = valOf(PEOPLE[PIDX.get(nm)], ci);
      if(v === '—') return -1;
      if(!idOf.has(v)) idOf.set(v, idOf.size);
      return idOf.get(v);
    });
  });
  // 지금까지 같은 조에 앉은 자리 수 — 이 세션 몫은 빠져 있다.
  // 적게 앉은 사람을 큰 조로 보내 만날 기회를 고르게 한다.
  const seats = names.map(nm=> SEATS ? SEATS[PIDX.get(nm)] : 0);
  // 조 크기로 메우기: 불리한 사람(+1)은 손이 많은 조로, 유리한 사람(-1)은 적은 조로.
  // 조 크기가 다 같으면 이 항은 상수라 아무 일도 하지 않는다.
  const bkeys = Object.keys(opt.bias || {}).filter(k=>opt.bias[k]);
  const bias = names.map(nm=>{
    if(!bkeys.length) return 0;
    const p = PEOPLE[PIDX.get(nm)];
    let b = 0;
    for(const k of bkeys){
      const q = k.indexOf(':');
      if(valOf(p, +k.slice(0,q)) === k.slice(q+1)) b += opt.bias[k];
    }
    return b;
  });
  // 유·불리를 정한 열은 그 열의 **모든 값**에 목표를 준다.
  // +1 값만 잡으면 나머지가 자유로워진다 — 1/2/3 처럼 세 단계일 때
  // 1 만 흩어지고 2 와 3 이 뭉쳐 버린다. 부호 0 은 그냥 비례 몫이다.
  const biasCols = new Set();
  for(const k of bkeys) biasCols.add(+k.slice(0, k.indexOf(':')));
  const biasGroups = [];
  const dis = new Int32Array(n);
  let disTot = 0;
  for(const ci of biasCols){
    const idOf = new Map(), vals = [];
    const vidx = new Int32Array(n);
    for(let i=0;i<n;i++){
      const v = valOf(PEOPLE[PIDX.get(names[i])], ci);
      if(!idOf.has(v)){ idOf.set(v, vals.length); vals.push({ val:v, tot:0, ci, sign:(opt.bias||{})[ci+':'+v] || 0 }); }
      const k = idOf.get(v);
      vidx[i] = k; vals[k].tot++;
    }
    for(let i=0;i<n;i++) if(vals[vidx[i]].sign > 0){ dis[i]++; disTot++; }
    biasGroups.push({ vidx, vals, buf: new Array(vals.length).fill(0) });
  }
  const attrs = [];
  for(const spec of (opt.attrs||[])){
    // 유·불리를 정한 열은 아래 기울인 목표가 맡는다.
    // 여기서 비례로 또 당기면 둘이 싸워서 기울기가 묻힌다.
    if(biasCols.has(spec.ci)) continue;
    const vs = []; const map = new Map();
    const v = new Int32Array(n);
    for(let i=0;i<n;i++){
      const val = valOf(PEOPLE[PIDX.get(names[i])], spec.ci);
      if(!map.has(val)){ map.set(val, vs.length); vs.push(val); }
      v[i] = map.get(val);
    }
    const tot = new Array(vs.length).fill(0);
    for(let i=0;i<n;i++) tot[v[i]]++;
    attrs.push({ ci:spec.ci, w:spec.w, mode:spec.mode||'spread', v, tot, nv:vs.length,
                 vals:vs, buf:new Array(vs.length).fill(0) });
  }
  const hasBias = biasCols.size > 0;
  const avgL = n / Math.max(1, opt.nTeams || 1);
  // 사람이 고른 짝: 이름으로 받아 이 자리의 번호로 바꾼다
  let pairW = null;
  if(opt.pairs && opt.pairs.length){
    const li = new Map(names.map((nm,i)=>[nm,i]));
    for(const pr of opt.pairs){
      const a = li.get(pr.a), b = li.get(pr.b);
      if(a==null || b==null || a===b) continue;   // 한쪽이 이 무리에 없으면 넘어간다
      if(!pairW) pairW = new Float64Array(n*n);
      pairW[a*n+b] += pr.w; pairW[b*n+a] += pr.w;
    }
  }
  // 특정 조에 못 박은 사람. -1 이면 자유롭게 움직인다.
  const pinTeam = new Int32Array(n).fill(-1);
  if(opt.pin){
    const K = opt.nTeams || 0;
    names.forEach((nm,i)=>{
      const t = opt.pin[nm];
      if(t != null && t >= 0 && t < K) pinTeam[i] = t;
    });
  }
  return { n, M, party, attrs, seats, bias, biasGroups, dis, disTot, avgL, guards, pairW, pinTeam, wMeet: opt.wMeet,
           // 조 크기를 유·불리로 정하기로 했으면 기회 균등은 그 세션에서 물러선다.
           // 둘 다 조 크기를 밀어대면 서로 상쇄한다.
           wFair: opt.wFair !== undefined ? opt.wFair : (hasBias ? 0 : 0.5),
           wBias: hasBias ? BIAS_W : 0,
           helpPen: (hasBias
             && biasGroups.some(g=>g.vals.some(v=>v.sign<0 && v.tot>0))
             && biasGroups.some(g=>g.vals.some(v=>v.sign>0 && v.tot>0))) ? HELP_PEN : 0,
           partyPen: opt.noParty===false ? 0 : PARTY_PEN };
}
function teamCost(ctx, mem){
  let c = 0; const L = mem.length, n = ctx.n;
  if(ctx.wFair){
    const e = L - 1;
    for(let a=0;a<L;a++){ const t = ctx.seats[mem[a]] + e; c += ctx.wFair * t * t; }
  }
  if(ctx.wBias){
    // 목표를 조 크기 쪽으로 기울인다. 불리한 값(+1)은 큰 조가 몫보다 더 받고,
    // 유리한 값(-1)은 작은 조가 더 받는다. 부호가 0 이면 그냥 비례다.
    // 어느 부호든 가중치의 합은 n 이라 목표의 합은 언제나 tot 이다.
    const d = L - ctx.avgL;
    let nDis = 0, nAdv = 0;
    for(let k=0;k<ctx.biasGroups.length;k++){
      const bg = ctx.biasGroups[k], cnt = bg.buf, V = bg.vals.length;
      for(let v=0;v<V;v++) cnt[v] = 0;
      for(let a=0;a<L;a++) cnt[bg.vidx[mem[a]]]++;     // 열마다 한 번만 훑는다
      for(let v=0;v<V;v++){
        const bv = bg.vals[v], g = cnt[v];
        let tgt = bv.tot * (L + bv.sign * BIAS_TILT * d) / n;
        if(tgt < 0) tgt = 0; else if(tgt > L) tgt = L;
        const t = g - tgt;
        c += ctx.wBias * t * t;                // 이차라 한 조에 몰리지도 않는다
        if(bv.sign > 0) nDis += g; else if(bv.sign < 0) nAdv += g;
      }
    }
    // 한 사람이 여러 가지로 불리하면 그만큼 더 쳐준다 (동행이면서 개발 경험도 없다면)
    if(ctx.disTot){
      let g = 0;
      for(let a=0;a<L;a++) g += ctx.dis[mem[a]];
      let tgt = ctx.disTot * (L + BIAS_TILT * d) / n;
      if(tgt < 0) tgt = 0;
      const t = g - tgt;
      c += ctx.wBias * t * t;
    }
    // 불리한 사람 수만큼 도울 사람이 있어야 한다. 모자란 만큼 값을 친다 —
    // '유리한 팀'은 조가 큰 것만이 아니라 잘하는 사람이 많은 것이기도 하다.
    if(ctx.helpPen && nDis > nAdv) c += ctx.helpPen * (nDis - nAdv);
  }
  for(let a=0;a<L;a++){
    const i = mem[a];
    for(let b=a+1;b<L;b++){
      const j = mem[b];
      const m = ctx.M[i*n+j];
      if(m) c += ctx.wMeet * m * m;
      if(ctx.partyPen && ctx.party[i] && ctx.party[i]===ctx.party[j]) c += ctx.partyPen;
      for(let k=0;k<ctx.guards.length;k++){
        const gv = ctx.guards[k];
        if(gv[i] >= 0 && gv[i] === gv[j]) c += GUARD_PEN;
      }
      if(ctx.pairW) c += ctx.pairW[i*n+j];
    }
  }
  for(let k=0;k<ctx.attrs.length;k++){
    const at = ctx.attrs[k], cnt = at.buf;
    for(let v=0;v<at.nv;v++) cnt[v]=0;
    for(let a=0;a<L;a++) cnt[at.v[mem[a]]]++;
    if(at.mode==='cluster'){
      let ss=0; for(let v=0;v<at.nv;v++) ss += cnt[v]*cnt[v];
      c += at.w * (L*L - ss) / 2;
    } else {
      for(let v=0;v<at.nv;v++){
        const ideal = at.tot[v] * L / n;
        const d = cnt[v] - ideal;
        c += at.w * d * d;
      }
    }
  }
  return c;
}
function totalCost(ctx, teams){ let t=0; for(const g of teams) t += teamCost(ctx,g); return t; }

function anneal(ctx, sizes, seed, iters){
  const r = rng(seed);
  const K = sizes.length;
  // 못 박은 사람을 먼저 자기 조 앞자리에 앉힌다. 그 자리는 끝까지 안 건드린다.
  const teams = sizes.map(()=>[]);
  const nPin = new Array(K).fill(0);
  const free = [];
  for(let i=0;i<ctx.n;i++){
    const t = ctx.pinTeam[i];
    if(t >= 0 && t < K && teams[t].length < sizes[t]){ teams[t].push(i); nPin[t]++; }
    else free.push(i);                       // 자리가 모자라면 그냥 자유롭게 둔다
  }
  const ord = shuffled(free, r);
  let p = 0;
  for(let t=0;t<K;t++) while(teams[t].length < sizes[t]) teams[t].push(ord[p++]);
  const tc = teams.map(t=>teamCost(ctx,t));
  let tot = tc.reduce((a,b)=>a+b,0);
  if(K < 2) return { teams, cost: tot };
  // 온도는 곱셈으로 식힌다 — 되풀이마다 Math.pow 를 부르면 그것이 제일 무겁다
  const T0 = 4, T1 = 0.02;
  const decay = Math.pow(T1/T0, 1/Math.max(1,iters));
  let T = T0;
  for(let it=0; it<iters; it++){
    T *= decay;
    const a = ri(r,K); let b = ri(r,K); if(a===b) b = (b+1)%K;
    const fa = teams[a].length - nPin[a], fb = teams[b].length - nPin[b];
    if(fa <= 0 || fb <= 0) continue;         // 그 조는 통째로 못 박혔다
    const ia = nPin[a] + ri(r,fa), ib = nPin[b] + ri(r,fb);
    const pa = teams[a][ia], pb = teams[b][ib];
    teams[a][ia] = pb; teams[b][ib] = pa;
    const na = teamCost(ctx,teams[a]), nb = teamCost(ctx,teams[b]);
    const d = (na+nb) - (tc[a]+tc[b]);
    if(d <= 0 || r() < Math.exp(-d/T)){ tc[a]=na; tc[b]=nb; tot += d; }
    else { teams[a][ia]=pa; teams[b][ib]=pb; }
  }
  return { teams, cost: tot };
}
function solve(ctx, sizes, seed, tries){
  let best = null;
  // 되풀이 횟수는 사람 수에 맞춰 잡는다 — 손댈 때마다 다시 도니 0.3초 안에 끝나야 한다
  const iters = Math.max(4000, Math.min(20000, ctx.n*ctx.n*25));
  for(let t=0;t<tries;t++){
    const r = anneal(ctx, sizes, seed + t*7919, iters);
    if(!best || r.cost < best.cost) best = r;
  }
  return best;
}
function sessCtxOpts(sess, names){
  const specs = [];
  for(const ci of attrCols()){
    const cfg = sess.attrs[ci];
    if(!cfg || !cfg.level) continue;
    specs.push({ ci, w: LV_W[cfg.level], mode: cfg.mode || 'spread' });
  }
  return { attrs: specs, wMeet: MEET_W[sess.meet], bias: sess.bias || null,
           pin: sess.pin || null, nTeams: teamSizes(names.length, sess).length };
}
/* 그 사람의 유·불리 값 (+1 불리 · -1 유리 · 0 아무것도 아님) */
function biasOf(sess, name){
  const b = sess.bias; if(!b) return 0;
  const p = PEOPLE[PIDX.get(name)]; if(!p) return 0;
  let v = 0;
  for(const k in b){
    const q = k.indexOf(':');
    if(valOf(p, +k.slice(0,q)) === k.slice(q+1)) v += b[k];
  }
  return v;
}
const hasBias = (sess)=> !!(sess.bias && Object.keys(sess.bias).some(k=>sess.bias[k]));
/* 유·불리를 정한 (열, 값) 목록 — 불리(+1)가 앞, 유리(-1)가 뒤 */
function biasMarks(sess){
  const out = [];
  if(!sess.bias) return out;
  for(const k in sess.bias){
    const sg = sess.bias[k];
    if(!sg) continue;
    const q = k.indexOf(':');
    out.push({ ci:+k.slice(0,q), val:k.slice(q+1), sign:sg });
  }
  return out.sort((a,b)=> b.sign - a.sign || (a.val < b.val ? -1 : 1));
}
/* 그 조 안에 그 값을 가진 사람이 몇인가 */
const countVal = (team, ci, val)=>
  team.reduce((a,n)=>{ const p = PEOPLE[PIDX.get(n)]; return a + (p && valOf(p,ci)===val ? 1 : 0); }, 0);

/* ── 만남 행렬 ── */
function addMeet(meet, N, teams, sign){
  for(const g of teams){
    for(let a=0;a<g.length;a++){
      const i = PIDX.get(g[a]);
      if(i==null) continue;
      if(SEATS) SEATS[i] += sign * (g.length - 1);
      for(let b=a+1;b<g.length;b++){
        const j = PIDX.get(g[b]);
        if(j==null) continue;
        meet[i*N+j] += sign; meet[j*N+i] += sign;
      }
    }
  }
}

let MEET = null, SEATS = null, NP = 0, LASTMS = 0;
function recompute(){
  buildPeople();
  NP = PEOPLE.length;
  MEET = new Int32Array(NP*NP);
  SEATS = new Int32Array(NP);
  if(!NP){ return; }
  prunePins();          // 빠진 사람·없어진 조에 걸린 고정을 걷는다
  const t0 = performance.now();

  for(const sess of S.sessions){
    const names = attendees(sess);
    if(sess.locked && sess.teams){
      sess.teams = sess.teams.map(g=>g.filter(n=>PIDX.has(n)));
    } else {
      const sizes = teamSizes(names.length, sess);
      if(!sizes.length){ sess.teams = []; continue; }
      const ctx = buildCtx(names, MEET, NP, sessCtxOpts(sess, names));
      const best = solve(ctx, sizes, sess.seed, 5);
      sess.teams = best.teams.map(g=>g.map(i=>names[i]));
    }
    addMeet(MEET, NP, sess.teams, +1);
  }

  // 다듬기: 다른 세션들을 다 알고 나서 각 세션을 다시 본다
  for(let round=0; round<2; round++){
    for(const sess of S.sessions){
      if(sess.locked || !sess.teams) continue;
      const names = attendees(sess);
      if(names.length < 2) continue;
      addMeet(MEET, NP, sess.teams, -1);
      const ctx = buildCtx(names, MEET, NP, sessCtxOpts(sess, names));
      const li = new Map(names.map((n,i)=>[n,i]));
      const cur = sess.teams.map(g=>g.map(n=>li.get(n)).filter(x=>x!=null));
      const curCost = totalCost(ctx, cur);
      const cand = solve(ctx, teamSizes(names.length, sess), sess.seed + round*104729, 2);
      if(cand.cost < curCost - 1e-9) sess.teams = cand.teams.map(g=>g.map(i=>names[i]));
      addMeet(MEET, NP, sess.teams, +1);
    }
  }

  computeRooms();
  LASTMS = performance.now() - t0;
}

/* ═══ 숙박 ═══
   강제 편성한 사람을 먼저 빼고, 남은 사람을 성별로 갈라
   각각 2인실로 짝짓는다. 값은 "아직 안 만난 사이"가 싸다. */
function roomPool(){
  const fixedSet = new Set();
  for(const r of S.rooms.fixed) for(const n of r) if(n) fixedSet.add(n);
  return activeNames().filter(n=>!fixedSet.has(n) && !S.rooms.absent[n]);
}
function pairSizes(n, odd){
  if(n<=0) return [];
  if(n===1) return [1];
  if(n%2===0) return new Array(n/2).fill(2);
  if(odd==='triple' && n>=3){ const a = new Array((n-3)/2).fill(2); a.push(3); return a; }
  const a = new Array((n-1)/2).fill(2); a.push(1); return a;
}
/* 지킬 열은 *이름* 으로 들고 있다 — 번호로 들면 명단을 다시 붙일 때 죽는다 */
/* 방 번호는 자리(몇 번째 방)에 붙는다 — 다시 섞어도 그 방은 그 방이다 */
function roomLabel(i){
  const v = (S.rooms.labels || {})[i];
  return (v && String(v).trim()) ? String(v).trim() : (i+1)+'호';
}
function roomGuards(){
  return (S.rooms.guardNames || [])
    .map(h=>S.headers.indexOf(h))
    .filter(i=>i>=0 && S.roles[i]==='attr');
}
/* 사람이 고른 짝을 값으로 바꾼다. 한 묶음 안의 모든 짝에 적용된다. */
function roomPairs(){
  const out = [];
  const add = (list, w)=>{
    for(const grp of (list||[])){
      const who = grp.filter(n=>PIDX.has(n) && !S.out[n]);
      for(let a=0;a<who.length;a++) for(let b=a+1;b<who.length;b++)
        out.push({ a:who[a], b:who[b], w });
    }
  };
  add(S.rooms.avoid,  AVOID_PEN);
  add(S.rooms.prefer, -PREFER_BONUS);
  return out;
}
function computeRooms(){
  const R = S.rooms;
  R.list = null;
  if(!NP) return;
  const pool = roomPool();
  const gc = S.genderCol;
  const groups = new Map();
  for(const nm of pool){
    const g = gc>=0 ? valOf(PEOPLE[PIDX.get(nm)], gc) : '전체';
    if(!groups.has(g)) groups.set(g, []);
    groups.get(g).push(nm);
  }
  const out = [];
  for(const r of R.fixed){
    const who = r.filter(n=>PIDX.has(n) && !S.out[n]);
    if(who.length) out.push({ who, fixed:true, gender:'—' });
  }
  let gi = 0;
  for(const [g, names] of groups){
    gi++;
    if(!names.length) continue;
    const sizes = pairSizes(names.length, R.odd);
    if(!sizes.length) continue;
    // 방은 모두 2인실이라 기회를 따질 것이 없다 — 안 만난 사이인지만 본다
    const ctx = buildCtx(names, MEET, NP, { attrs:[], wMeet:ROOM_MEET, wFair:0, nTeams: sizes.length,
                                            guards: roomGuards(), pairs: roomPairs(),
                                            noParty: R.allowParty ? false : true });
    const best = solve(ctx, sizes, (R.seed|0) + gi*31337, 9);
    for(const grp of best.teams) out.push({ who: grp.map(i=>names[i]), fixed:false, gender:g });
  }
  R.list = out;
  if(R.count){
    const teams = out.map(r=>r.who);
    addMeet(MEET, NP, teams, +1);
  }
}

/* ═══ 진단 ═══ */
function diagnose(){
  const act = activeNames();
  const n = act.length;
  const d = { n, distinct:[], chance:[], dup2:0, dup3:0, pairs:0, met:0, violations:[], sessions:[] };
  if(!n || !MEET) return d;

  for(const nm of act){
    const i = PIDX.get(nm);
    let dis = 0;
    for(const nm2 of act){
      if(nm2===nm) continue;
      if(MEET[i*NP + PIDX.get(nm2)] > 0) dis++;
    }
    d.distinct.push({ name:nm, v:dis });
  }
  // 만남 기회(같은 조에 앉은 자리 수) — 중복이 없다면 이만큼 다른 사람을 만난다
  const chance = new Map(act.map(a=>[a,0]));
  const tally = (teams)=>{ for(const g of teams) for(const nm of g) if(chance.has(nm)) chance.set(nm, chance.get(nm) + g.length - 1); };
  for(const s of S.sessions) if(s.teams) tally(s.teams);
  if(S.rooms.count && S.rooms.list) tally(S.rooms.list.map(r=>r.who));
  d.chance = act.map(nm=>({ name:nm, v:chance.get(nm) }));

  for(let a=0;a<act.length;a++) for(let b=a+1;b<act.length;b++){
    const v = MEET[PIDX.get(act[a])*NP + PIDX.get(act[b])];
    d.pairs++;
    if(v>0) d.met++;
    if(v>=2) d.dup2++;
    if(v>=3) d.dup3++;
  }

  // 세션별 균형·위반
  for(const s of S.sessions){
    if(!s.teams) continue;
    const names = attendees(s);
    const rec = { name:s.name, teams:s.teams.length, attrs:[], party:0 };
    for(const g of s.teams){
      for(let a=0;a<g.length;a++) for(let b=a+1;b<g.length;b++){
        const pa = PEOPLE[PIDX.get(g[a])], pb = PEOPLE[PIDX.get(g[b])];
        if(pa && pb && pa.party && pa.party===pb.party) rec.party++;
      }
    }
    if(rec.party){
      // 묶음이 조 개수보다 크면 애초에 못 가른다 — 배정 탓이 아니라 산수다
      const gs = new Map();
      for(const nm of names){
        const p = PEOPLE[PIDX.get(nm)];
        if(p && p.party) gs.set(p.party, (gs.get(p.party)||0) + 1);
      }
      const big = gs.size ? Math.max.apply(null, Array.from(gs.values())) : 0;
      d.violations.push(s.name + ' — 일행 ' + rec.party + '쌍이 같은 조입니다'
        + (big > s.teams.length
            ? ' (일행 한 묶음이 ' + big + '명인데 조는 ' + s.teams.length + '개뿐이라 다 가를 수 없습니다)'
            : ''));
    }
    // 조 크기로 메우다 불리한 사람이 한 조에 몰리지 않았나 — 값마다 따로 본다
    for(const mk of biasMarks(s)){
      const tot = countVal(names, mk.ci, mk.val);
      if(!tot) continue;
      let worst = 0, worstTeam = 0;
      s.teams.forEach((g,i)=>{
        const dev = countVal(g, mk.ci, mk.val) - tot * g.length / Math.max(1, names.length);
        if(dev > worst){ worst = dev; worstTeam = i+1; }
      });
      if(worst > 1.25) d.violations.push(s.name + ' — ' + worstTeam + '조에 ' + mk.val
        + ' 인 사람이 몰렸습니다 (몫보다 ' + worst.toFixed(1) + '명 많음)');
    }
    for(const ci of attrCols()){
      const cfg = s.attrs[ci];
      const lvl = cfg ? cfg.level : 0;
      const vals = new Map();
      for(const nm of names){ const v = valOf(PEOPLE[PIDX.get(nm)], ci); vals.set(v,(vals.get(v)||0)+1); }
      // 유·불리를 정한 값은 목표가 조 크기 쪽으로 기울어 있다.
      // 비례로 재면 일부러 기울인 것이 어긋난 것처럼 보인다.
      const bias = s.bias || {};
      const avgL = names.length / Math.max(1, s.teams.length);
      let maxDev = 0, tilted = false;
      for(const g of s.teams){
        const cnt = new Map();
        for(const nm of g){ const v = valOf(PEOPLE[PIDX.get(nm)], ci); cnt.set(v,(cnt.get(v)||0)+1); }
        for(const [v,tot] of vals){
          let ideal;
          if(bias[ci+':'+v] > 0){
            tilted = true;
            ideal = tot * (g.length + BIAS_TILT*(g.length - avgL)) / Math.max(1,names.length);
            if(ideal < 0) ideal = 0;
          } else {
            ideal = tot * g.length / Math.max(1,names.length);
          }
          maxDev = Math.max(maxDev, Math.abs((cnt.get(v)||0) - ideal));
        }
      }
      rec.attrs.push({ ci, name:S.headers[ci], level:lvl, mode:(cfg&&cfg.mode)||'spread',
                       dev:maxDev, tilted });
    }
    d.sessions.push(rec);
  }

  // 숙박 검사 — 성별 · 이미 만난 사이 · 지킬 열 · 사람이 고른 짝
  const R = S.rooms;
  if(R.list){
    const roomOf = new Map();
    R.list.forEach((r,i)=> r.who.forEach(n=> roomOf.set(n, i)));
    if(S.genderCol>=0) for(const r of R.list){
      if(r.fixed) continue;
      const gs = new Set(r.who.map(n=>valOf(PEOPLE[PIDX.get(n)], S.genderCol)));
      if(gs.size>1) d.violations.push('숙박 — ' + r.who.join(', ') + ' 방에 성별이 섞였습니다');
    }
    // 이미 만난 사이가 한 방에
    const met = [];
    for(const r of R.list){
      if(r.fixed) continue;
      for(let a=0;a<r.who.length;a++) for(let b=a+1;b<r.who.length;b++){
        const i = PIDX.get(r.who[a]), j = PIDX.get(r.who[b]);
        if(i!=null && j!=null && MEET[i*NP+j] > (R.count?1:0)) met.push(r.who[a]+'·'+r.who[b]);
      }
    }
    d.roomMet = met;
    // 같은 값이면 다른 방으로 두기로 한 열
    for(const ci of roomGuards()){
      for(const r of R.list){
        if(r.fixed) continue;
        const vs = r.who.map(n=>valOf(PEOPLE[PIDX.get(n)], ci)).filter(v=>v!=='—');
        if(vs.length>1 && new Set(vs).size===1)
          d.violations.push('숙박 — ' + r.who.join(', ') + ' 방이 ' + S.headers[ci] + ' 가 같습니다 (' + vs[0] + ')');
      }
    }
    // 사람이 고른 짝
    for(const grp of (R.avoid||[])){
      const who = grp.filter(n=>PIDX.has(n) && !S.out[n]);
      for(let a=0;a<who.length;a++) for(let b=a+1;b<who.length;b++)
        if(roomOf.get(who[a]) === roomOf.get(who[b]) && roomOf.has(who[a]))
          d.violations.push('숙박 — ' + who[a] + ' 와 ' + who[b] + ' 는 같은 방 안 된다고 했는데 같은 방입니다');
    }
    const missed = [];
    for(const grp of (R.prefer||[])){
      const who = grp.filter(n=>PIDX.has(n) && !S.out[n]);
      for(let a=0;a<who.length;a++) for(let b=a+1;b<who.length;b++)
        if(roomOf.get(who[a]) !== roomOf.get(who[b])) missed.push(who[a]+'·'+who[b]);
    }
    d.roomMissed = missed;
  }
  return d;
}

    });

    h += '<div class="row" style="margin-top:12px"><span class="lbl">성별 열</span>'
      +  '<select class="pick" id="sel-gender"><option value="-1">없음</option>'

      +  '</select><span class="note">숙박 방을 가를 때만 씁니다</span></div>';
    // 일행이 제대로 잡혔는지 눈으로 보이게 한다 — 안 잡히면 조가 그냥 섞인다

      h += '<span class="pill bad">열이 정해지지 않았습니다 — 같은 조에 들어갑니다</span>'

    } else {
      const groups = new Map();
      for(const p of PEOPLE){
        if(S.out[p.name] || !p.party) continue;
        groups.set(p.party, (groups.get(p.party)||0) + 1);
      }
      const sz = Array.from(groups.values()).filter(v=>v>1);
      const solo = Array.from(groups.entries()).filter(([,v])=>v===1).length;
      if(!sz.length){
        h += '<span class="pill warn">묶음이 없습니다</span>'
          +  '<span class="note">'+esc(S.headers[pc])+' 열에 값이 같은 사람이 없습니다'
          +  (solo?' (혼자뿐인 값 '+solo+'개)':'')+'</span>';

        const big = Math.max.apply(null, sz);
        h += '<span class="pill ok">'+sz.length+'묶음 · '+sz.reduce((a,b)=>a+b,0)+'명</span>'
          +  '<span class="note">가장 큰 묶음 '+big+'명 · '+esc(S.headers[pc])+' 열 기준</span>';
      }
    }
    h += '</div>';
    if(ONLINE){
      const n = (ONLINE.rows || []).length;
      h += '<div class="row" style="margin-top:8px"><span class="lbl">온라인 저장본</span>'
        +  '<span class="pill">'+n+'명'+(ONLINE.savedAt?' · '+esc(ONLINE.savedAt):'')+'</span>'
        +  '<button class="btn sm" id="b-cloudload">불러오기</button>'
        +  '<span class="note">이 브라우저의 것을 덮어씁니다</span></div>';
    }
    if(S.raw){
      h += '<div class="row" style="margin-top:8px"><span class="lbl">첫 줄</span>'
        +  '<span class="note">'+(S.hasHeader?'열 이름으로 읽었습니다':'사람으로 읽었습니다')+'</span>'
        +  '<button class="btn sm" id="b-hdr">'+(S.hasHeader?'첫 줄도 사람입니다':'첫 줄은 열 이름입니다')+'</button></div>';
    }
    h += '</div>';

    h += '<div class="card pad" style="margin-top:14px">'
      +  '<div class="lbl" style="margin-bottom:8px">참가자 <span class="note noprint">— 이름을 누르면 워크샵 전체에서 빠집니다</span></div>'
      +  '<div class="chips">'
      +  PEOPLE.slice().sort((a,b)=>byName(a.name,b.name))
           .map(p=>'<button class="chip'+(S.out[p.name]?' off':'')+'" data-out="'+esc(p.name)+'">'
      +     esc(p.name) + (p.party?'<span class="pt">'+esc(p.party)+'</span>':'') + '</button>').join('')
      +  '</div></div>';
  }
  b.innerHTML = h;

  if(!has || showPaste){
    $('b-take').onclick = ()=>{
      const t = $('ta-sheet').value;
      if(!t.trim()){ toast('붙여넣은 것이 없습니다'); return; }
      takeTable(t);
    };
    const bh = $('b-hide'); if(bh) bh.onclick = ()=>{ showPaste=false; render(); };
  }
  b.querySelectorAll('[data-role]').forEach(sel=>{
    sel.onchange = ()=> act(()=>{
      const i = +sel.dataset.role, v = sel.value;
      if(v==='name') S.roles.forEach((r,k)=>{ if(r==='name') S.roles[k]='attr'; });
      if(v==='party') S.roles.forEach((r,k)=>{ if(r==='party') S.roles[k]='attr'; });
      S.roles[i] = v;
      if(S.genderCol===i && v!=='attr') S.genderCol = -1;
    });
  });
  const sg = $('sel-gender'); if(sg) sg.onchange = ()=> act(()=>{ S.genderCol = +sg.value; });
  const bh2 = $('b-hdr'); if(bh2) bh2.onclick = ()=>{ takeTable(S.raw, !S.hasHeader); };
  const bc = $('b-cloudload');
  if(bc) bc.onclick = ()=> act(()=>{
    S = Object.assign(blankState(), ONLINE);
    S.rooms = Object.assign(blankState().rooms, ONLINE.rooms || {});
  });
  b.querySelectorAll('[data-out]').forEach(el=>{
    el.onclick = ()=> act(()=>{
      const n = el.dataset.out;
      if(S.out[n]) delete S.out[n]; else S.out[n]=true;
    });
  });
}

function takeTable(text, forceHeader){
  const rows = parseTable(text);
  if(!rows || rows.length<2){ toast('표를 읽지 못했습니다'); return; }
  act(()=>{
    const head = rows[0];
    const looksHeader = forceHeader !== undefined ? forceHeader
      : (head.some(c=>RE_NAME.test(c)||RE_PARTY.test(c)||RE_GEND.test(c)) ||
         head.every(c=>c && isNaN(Number(c))));
    // 이미 골라둔 것은 열 *이름* 으로 이어받는다.
    // 명단을 고쳐 다시 붙여넣었다고 조건 설정이 날아가면 안 된다.
    const oldH = S.headers.slice();
    const oldRole = {}, oldAttr = S.sessions.map(()=>({}));
    oldH.forEach((h,i)=>{ if(S.roles[i]) oldRole[h] = S.roles[i]; });
    S.sessions.forEach((s,si)=>{
      for(const k in s.attrs){ const h = oldH[k]; if(h) oldAttr[si][h] = s.attrs[k]; }
    });
    const oldGender = S.genderCol>=0 ? oldH[S.genderCol] : null;
    // 유·불리도 열 *이름* 으로 이어받는다. 번호로 들고 있으면 열 차례가 바뀔 때
    // 엉뚱한 열을 가리켜 아무것도 세지 못한다 (X 라고 적었는데 X 0 으로 나온다)
    const oldBias = S.sessions.map(s=>{
      const m = {};
      for(const k in (s.bias||{})){
        const q = k.indexOf(':'), h = oldH[+k.slice(0,q)];
        if(h) m[h + '␀' + k.slice(q+1)] = s.bias[k];
      }
      return m;
    });

    S.raw = text;
    S.hasHeader = looksHeader;
    S.headers = looksHeader ? head.map((c,i)=>c||('열'+(i+1))) : head.map((c,i)=>'열'+(i+1));
    S.rows = looksHeader ? rows.slice(1) : rows;

    // 열이 하는 일: 전에 알던 것이 있으면 그대로, 없으면 알아서 짚는다
    const known = S.headers.some(h=>oldRole[h]);
    S.roles = S.headers.map(h=> (known && oldRole[h]) ? oldRole[h] : 'attr');
    if(S.roles.indexOf('name') < 0){
      let ni = S.headers.findIndex(h=>RE_NAME.test(h));
      if(ni<0) ni = 0;
      S.roles[ni] = 'name';
    }
    if(S.roles.indexOf('party') < 0){
      const pi = S.headers.findIndex((h,i)=>S.roles[i]!=='name' && RE_PARTY.test(h));
      if(pi>=0) S.roles[pi] = 'party';
    }
    const gKeep = oldGender!=null ? S.headers.indexOf(oldGender) : -1;
    if(gKeep>=0 && S.roles[gKeep]==='attr') S.genderCol = gKeep;
    else {
      const gi = S.headers.findIndex((h,i)=>S.roles[i]==='attr' && RE_GEND.test(h));
      S.genderCol = gi>=0 ? gi : -1;
    }

    if(!S.sessions.length) seedSessions();
    S.sessions.forEach((s,si)=>{
      const prev = oldAttr[si] || {};   // seedSessions 로 갓 생긴 세션은 전에 아는 것이 없다
      s.attrs = {};
      S.headers.forEach((h,ci)=>{ if(S.roles[ci]==='attr' && prev[h]) s.attrs[ci] = prev[h]; });
      const pb = oldBias[si] || {};
      const nb = {};
      S.headers.forEach((h,ci)=>{
        if(S.roles[ci]!=='attr') return;
        for(const k in pb){
          const q = k.indexOf('␀');
          if(k.slice(0,q) === h) nb[ci + ':' + k.slice(q+1)] = pb[k];
        }
      });
      s.bias = Object.keys(nb).length ? nb : undefined;   // 비면 autoDefaults 가 다시 짚는다
      s.teams = null;
    });
    buildPeople();      // autoDefaults·pruneBias 가 열의 값들을 봐야 한다
    pruneBias();
    prunePins();
    autoDefaults();
  });
  showPaste = false; render();
  toast(PEOPLE.length + '명을 읽었습니다');
}

/* 손대지 않은 조건에만 쓸 만한 기본값을 넣어둔다. 사람이 정한 것은 그대로.

   사전교육은 **모든 세션에서 필수**다. 교육을 안 받은 사람은 대개 일행으로 따라온
   사람이라, 일행 제약만으로는 갈라지지 않는다 — 서로 다른 일행에 속한 미수료자 둘은
   한 조에 들 수 있다. 그래서 값 자체를 조마다 흩어야 한다.
   개발경험은 해커톤에서만 값을 친다. */
const RE_HACK = /해커톤|해커|hack/i;
const RE_DEV  = /개발|코딩|코드|프로그래밍|dev|coding|program|engineer/i;
const RE_EDU  = /교육|수료|사전|학습|이수|training|course|onboard/i;
/* 값 하나를 보고 유리한 쪽인지 불리한 쪽인지 짐작한다.
   O·X 처럼 기호로 적는 시트가 많아 기호를 먼저 본다.
   '미수료'는 '수료'를, '불가능'은 '가능'을 품고 있으니 불리 쪽을 먼저 봐야 한다. */
function biasGuess(v){
  const t = String(v).trim();
  if(/^[xX×✕✗✘]$/.test(t)) return 1;
  if(/^[oO○◯●⭕]$/.test(t)) return -1;
  if(/^[?？]+$/.test(t)) return 1;   // 모르면 불리 쪽으로 — 틀려도 손이 많은 조라 손해가 없다
  if(/없|미수료|미이수|안\s*받|무경험|불가|초보|^(no|n)$/i.test(t)) return 1;
  if(/있|수료|이수|완료|가능|경험|^(yes|y)$/i.test(t)) return -1;
  return 0;
}
/* 값이 대체로 숫자면 척도로 본다: 제일 낮은 값이 불리, 제일 높은 값이 유리,
   가운데는 0(비례). 1·2·3 같은 실력 등급이 여기 걸린다. */
const NUMV = /^-?\d+(\.\d+)?$/;
function scaleBias(vals){
  const nums = vals.filter(v=>NUMV.test(v)).map(Number);
  if(nums.length < 2 || nums.length < vals.length - 2) return null;
  const lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums);
  if(lo === hi) return null;
  const out = {};
  for(const v of vals){
    if(NUMV.test(v)){
      const x = Number(v);
      out[v] = x <= lo ? 1 : (x >= hi ? -1 : 0);
    } else {
      out[v] = biasGuess(v);          // O·? 처럼 숫자가 아닌 나머지
    }
  }
  return out;
}
function autoDefaults(){
  for(const s of S.sessions){
    const hack = RE_HACK.test(s.name);
    S.headers.forEach((h,ci)=>{
      if(S.roles[ci]!=='attr') return;
      if(s.attrs[ci]) return;                     // 사람이 이미 정했다
      if(RE_EDU.test(h)) s.attrs[ci] = { level:3, mode:'spread' };
      else if(hack && RE_DEV.test(h)) s.attrs[ci] = { level:3, mode:'spread' };
    });
    // 해커톤은 조 크기로도 메운다 — 없음·미수료가 손이 많은 조로 간다
    if(hack && !s.bias){
      const b = {};
      // 남의 동행으로 온 사람은 깍두기다. 더 나은 자리로 보낸다
      if(S.roles.indexOf('party') >= 0) b[PARTY_CI + ':동행'] = 1;
      S.headers.forEach((h,ci)=>{
        if(S.roles[ci]!=='attr') return;
        if(!RE_DEV.test(h) && !RE_EDU.test(h)) return;
        const vals = colValues(ci);
        const sc = scaleBias(vals);
        for(const v of vals){
          const g = sc ? sc[v] : biasGuess(v);
          if(g) b[ci+':'+v] = g;
        }
      });
      s.bias = b;
    }
  }
}
/* 지금 명단에 없는 열·값을 가리키는 유·불리 키를 걷어낸다.
   죽은 키는 조용히 아무 일도 안 해서 "X 라고 적었는데 X 0" 처럼 보인다.
   다 걷어내면 s.bias 를 지워 autoDefaults 가 다시 짚게 둔다. */
/* 조 개수가 줄었거나 그 사람이 빠졌으면 못 박은 것을 걷어낸다 */
function prunePins(){
  for(const s of S.sessions){
    if(!s.pin) continue;
    const K = teamSizes(attendees(s).length, s).length;
    for(const nm in s.pin){
      if(!PIDX.has(nm) || S.out[nm] || s.absent[nm] || s.pin[nm] >= K) delete s.pin[nm];
    }
    if(!Object.keys(s.pin).length) delete s.pin;
  }
}
function pruneBias(){
  for(const s of S.sessions){
    if(!s.bias) continue;
    let live = 0;
    for(const k in s.bias){
      const q = k.indexOf(':'), ci = +k.slice(0,q), val = k.slice(q+1);
      const okCol = ci === PARTY_CI ? (S.roles.indexOf('party') >= 0) : (S.roles[ci] === 'attr');
      const okVal = okCol && colValues(ci).indexOf(val) >= 0;
      if(!okVal) delete s.bias[k]; else live++;
    }
    if(!live) s.bias = undefined;
  }
}
function colValues(ci){
  const out = [];
  const seen = new Set();
  for(const p of PEOPLE){
    const v = valOf(p, ci);
    if(!seen.has(v)){ seen.add(v); out.push(v); }
  }
  return out.sort();
}

/* ── 2 세션 ── */
function renderSessions(){
  const b = $('sess-body');
  if(!PEOPLE.length){ b.innerHTML = '<div class="empty">명단을 먼저 넣습니다.</div>'; return; }
  const ac = attrCols();
  let h = '';
  S.sessions.forEach((s, si)=>{
    const at = attendees(s);
    const sizes = teamSizes(at.length, s);
    const sizeTxt = sizes.length ? sizes.length+'개 조 · '+(Math.min.apply(null,sizes))+(Math.min.apply(null,sizes)!==Math.max.apply(null,sizes)?'~'+Math.max.apply(null,sizes):'')+'명' : '—';
    h += '<div class="scard'+(s.locked?' lock':'')+'" data-si="'+si+'">'
      +  '<div class="shead">'
      +    '<input class="nm" value="'+esc(s.name)+'" data-sname="'+si+'" aria-label="세션 이름">'
      +    '<span class="pill"><span class="v">'+at.length+'</span>명</span>'
      +    '<span class="pill">'+sizeTxt+'</span>'
      +    (s.locked && s.teams && [].concat.apply([], s.teams).length !== at.length
             ? '<span class="pill bad">확정한 배정에 '+at.length+'명 가운데 '
               + [].concat.apply([], s.teams).length + '명만 들어 있습니다</span>' : '')
      +    '<span class="sp" style="flex:1"></span>'
      +    '<button class="btn sm noprint" data-reroll="'+si+'">다시 섞기</button>'
      +    '<button class="btn sm noprint'+(s.locked?' pri':'')+'" data-lock="'+si+'">'+(s.locked?'확정됨':'확정')+'</button>'
      +    '<button class="btn sm warn noprint" data-del="'+si+'">삭제</button>'
      +  '</div><div class="sbody">'
      +    '<div class="row"><span class="lbl">조 나누기</span>'
      +      '<select class="pick" data-mode="'+si+'">'
      +        '<option value="size"'+(s.mode==='size'?' selected':'')+'>한 조에 몇 명</option>'
      +        '<option value="count"'+(s.mode==='count'?' selected':'')+'>조를 몇 개</option>'
      +      '</select>'
      +      '<input class="num" type="number" min="2" max="99" value="'+(s.mode==='count'?s.count:s.size)+'" data-num="'+si+'">'
      +      '<span class="note">'+(s.mode==='count'?'개':'명씩')+'</span>'
      +    '</div>'
      +    '<div class="row"><span class="lbl">새 사람 만나기</span>'+seg('meet',si,s.meet)+'</div>';
    if(ac.length){
      h += '<div style="border-top:1px solid var(--line); padding-top:9px; margin-top:2px">'
        +  '<div class="lbl" style="margin-bottom:5px">고르게 섞을 것</div><div class="attrgrid">';
      for(const ci of ac){
        const cfg = s.attrs[ci] || { level:0, mode:'spread' };
        h += '<div class="attrrow'+(cfg.level?' act':'')+'">'
          +  '<span class="an">'+esc(S.headers[ci])+'</span>'
          +  seg('attr', si+':'+ci, cfg.level)
          +  (cfg.level ? '<span class="seg">'
               + '<button data-amode="'+si+':'+ci+'" data-m="spread" class="'+(cfg.mode!=='cluster'?'on':'')+'">조마다 나눔</button>'
               + '<button data-amode="'+si+':'+ci+'" data-m="cluster" class="'+(cfg.mode==='cluster'?'on':'')+'">같은 값끼리</button>'
               + '</span>' : '')
          +  '</div>';
      }
      h += '</div></div>';
    }
    const absN = Object.keys(s.absent).filter(n=>PIDX.has(n) && !S.out[n]).length;
    const biasN = Object.keys(s.bias||{}).filter(k=>s.bias[k]).length;
    h += '<div class="noprint"><div class="row" style="gap:18px">'
      +  '<button class="foldbtn" data-fold="'+si+'">'
      +  (s._open ? '참석자 접기' : (absN ? absN+'명 불참 — 고치기' : '이 세션 불참자 고르기'))
      +  '</button>'
      +  '<button class="foldbtn" data-bfold="'+si+'">'
      +  (s._bopen ? '조 크기 맞추기 접기' : (biasN ? '조 크기로 메우기 — '+biasN+'개 정함' : '조 크기로 메우기'))
      +  '</button></div>';
    if(s._open){
      h += '<div class="fold chips">'
        +  activeNames().map(n=>'<button class="chip'+(s.absent[n]?' off':'')+'" data-abs="'+si+':'+esc(n)+'">'+esc(n)+'</button>').join('')
        +  '</div>';
    }
    if(s._bopen){
      const even = sizes.length && Math.min.apply(null,sizes)===Math.max.apply(null,sizes);
      h += '<div class="fold">'
        +  '<div class="note" style="margin-bottom:7px">조 인원이 딱 나누어떨어지지 않을 때만 값을 칩니다. '
        +  '불리한 사람은 손이 많은 조로, 유리한 사람은 손이 적은 조로 갑니다. '
        +  '눌러서 <b>큰 조 ▸ 작은 조 ▸ 안 봄</b> 순으로 바꿉니다.'
        +  (even ? ' <span style="color:var(--gold)">지금은 모든 조가 '+sizes[0]+'명이라 이 설정이 하는 일이 없습니다.</span>' : '')
        +  '</div>';
      let any = false;
      for(const ci of ac){
        const cfg = s.attrs[ci];
        if(!cfg || !cfg.level) continue;
        any = true;
        h += '<div class="attrrow"><span class="an">'+esc(S.headers[ci])+'</span><div class="who">'
          +  colValues(ci).map(v=>{
               const st = (s.bias && s.bias[ci+':'+v]) || 0;
               const cls = st>0 ? ' bias-up' : (st<0 ? ' bias-dn' : '');
               const mk  = st>0 ? ' ▲큰 조' : (st<0 ? ' ▼작은 조' : '');
               return '<button class="mini'+cls+'" data-bias="'+si+':'+ci+':'+esc(v)+'">'+esc(v)+mk+'</button>';
             }).join('')
          +  '</div></div>';
      }
      if(!any) h += '<div class="note">고르게 섞을 조건을 먼저 하나 켭니다.</div>';
      h += '</div>';
    }

  b.querySelectorAll('[data-mode]').forEach(el=>{

  });
  b.querySelectorAll('[data-num]').forEach(el=>{
    el.onchange = ()=> act(()=>{
      const s = S.sessions[+el.dataset.num]; const v = Math.max(1, Math.min(99, +el.value||2));
      if(s.mode==='count') s.count = v; else s.size = v;
    });
  });
  b.querySelectorAll('[data-seg]').forEach(el=>{
    el.onclick = ()=> act(()=>{
      const [kind, key] = el.dataset.seg.split('|');
      const lv = +el.dataset.lv;
      if(kind==='meet') S.sessions[+key].meet = lv;
      else {
        const [si,ci] = key.split(':').map(Number);
        const s = S.sessions[si];
        s.attrs[ci] = Object.assign({ mode:'spread' }, s.attrs[ci]||{}, { level: lv });
      }
    });
  });
  b.querySelectorAll('[data-amode]').forEach(el=>{
    el.onclick = ()=> act(()=>{
      const [si,ci] = el.dataset.amode.split(':').map(Number);
      S.sessions[si].attrs[ci].mode = el.dataset.m;
    });
  });
  b.querySelectorAll('[data-reroll]').forEach(el=>{
    el.onclick = ()=> act(()=>{ const s=S.sessions[+el.dataset.reroll]; s.seed = Math.floor(Math.random()*1e6); s.locked=false; });
  });
  b.querySelectorAll('[data-lock]').forEach(el=>{
    el.onclick = ()=> act(()=>{ const s=S.sessions[+el.dataset.lock]; s.locked = !s.locked; });
  });
  b.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=> act(()=>{ S.sessions.splice(+el.dataset.del,1); });
  });
  b.querySelectorAll('[data-fold]').forEach(el=>{
    el.onclick = ()=>{ const s=S.sessions[+el.dataset.fold]; s._open = !s._open; render(); };
  });
  b.querySelectorAll('[data-bfold]').forEach(el=>{
    el.onclick = ()=>{ const s=S.sessions[+el.dataset.bfold]; s._bopen = !s._bopen; render(); };
  });
  b.querySelectorAll('[data-bias]').forEach(el=>{
    el.onclick = ()=> act(()=>{
      const d = el.dataset.bias;
      const i = d.indexOf(':'), j = d.indexOf(':', i+1);
      const s = S.sessions[+d.slice(0,i)], key = d.slice(i+1);   // "열번호:값"
      if(!s.bias) s.bias = {};
      const cur = s.bias[key] || 0;
      s.bias[key] = cur > 0 ? -1 : (cur < 0 ? 0 : 1);            // 큰 조 ▸ 작은 조 ▸ 안 봄
    });
  });
  b.querySelectorAll('[data-abs]').forEach(el=>{
    el.onclick = ()=> act(()=>{
      const i = el.dataset.abs.indexOf(':');
      const s = S.sessions[+el.dataset.abs.slice(0,i)], n = el.dataset.abs.slice(i+1);
      if(s.absent[n]) delete s.absent[n]; else s.absent[n]=true;
    });
  });
}

/* ── 3 배정표 ── */
function markFor(nm, hi){
  if(hi<0) return '';
  const v = valOf(PEOPLE[PIDX.get(nm)], hi);
  const cls = ['a','b','c'][Math.abs(hashStr(v))%3];
  return '<span class="mk '+cls+'">'+esc(v)+'</span>';
}
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return h; }

function renderResult(){
  const b = $('result-body');
  if(!PEOPLE.length){ b.innerHTML = '<div class="empty">명단을 먼저 넣습니다.</div>'; $('result-sub').textContent=''; return; }
  $('result-sub').textContent = LASTMS ? ('셈하는 데 '+Math.round(LASTMS)+'ms') : '';
  let h = '';
  S.sessions.forEach((s, si)=>{
    if(!s.teams || !s.teams.length){ return; }
    const nPin = Object.keys(s.pin || {}).length;

    for(const ci of attrCols()){ const c = s.attrs[ci]; if(c && c.level>hiLv){ hiLv=c.level; hi=ci; } }

      +  (s.locked?'<span class="pill ok">확정</span>':'')
      +  (hi>=0?'<span class="note">이름 옆은 '+esc(S.headers[hi])+'</span>':'')
      +  (nPin ? '<span class="pill warn noprint">📌 '+nPin+'명 고정</span>'
                 + '<button class="btn sm noprint" data-unpinall="'+si+'">고정 풀기</button>' : '')
      +  '<span class="note noprint">이름을 누르면 그 조에 고정됩니다</span>'
      +  '</div><div class="teams">';
    const marks = biasMarks(s);
    s.teams.forEach((g,i)=>{
      h += '<div class="team" data-drop="'+si+':'+i+'"><h4><span>'+(i+1)+'조</span><span class="cnt">'+g.length+'명</span></h4>'
        // 불리하다고 표시한 값이 조마다 몇인지 드러낸다 — 몰렸으면 여기서 보인다
        +  (marks.length ? '<div class="bmark">'
             + marks.map(m=>'<i>'+(m.sign>0?'▲':'▼')+'</i>'+esc(m.val)
                 +' <b>'+countVal(g, m.ci, m.val)+'</b>').join(' · ')
             + '</div>' : '')
        +  '<ul>'
        +  sortNames(g).map(n=>{
             const pinned = s.pin && s.pin[n] != null;
             return '<li><button class="who-b'+(pinned?' pinned':'')+'" draggable="true"'
                  + ' data-pin="'+si+':'+i+':'+esc(n)+'"'
                  + ' title="'+(pinned?'누르면 고정이 풀립니다 · 끌어서 다른 조로':'누르면 이 조에 고정 · 끌어서 다른 조로')+'">'
                  + (pinned?'📌':'') + esc(n) + '</button>' + markFor(n,hi) + '</li>';
           }).join('')
        +  '</ul></div>';
    });
    h += '</div></div>';
  });
  b.innerHTML = h || '<div class="empty">아직 배정이 없습니다.</div>';

  b.querySelectorAll('[data-pin]').forEach(el=>{
    el.onclick = ()=> act(()=>{
      const d = el.dataset.pin;
      const i1 = d.indexOf(':'), i2 = d.indexOf(':', i1+1);
      const s = S.sessions[+d.slice(0,i1)], ti = +d.slice(i1+1,i2), n = d.slice(i2+1);
      if(!s.pin) s.pin = {};
      if(s.pin[n] != null) delete s.pin[n]; else s.pin[n] = ti;
      if(!Object.keys(s.pin).length) delete s.pin;
    });
  });
  wireDrag(b);
  b.querySelectorAll('[data-unpinall]').forEach(el=>{
    el.onclick = ()=> act(()=>{ delete S.sessions[+el.dataset.unpinall].pin; });
  });
}

/* 이름을 끌어 다른 조에 떨어뜨린다. 떨어뜨리면 그 조에 못 박는다 —
   그러지 않으면 다음 셈에서 도로 흩어져 손댄 보람이 없다. */
let DRAG = null;
function wireDrag(b){
  b.querySelectorAll('[data-pin]').forEach(el=>{
    el.ondragstart = (e)=>{
      DRAG = el.dataset.pin;
      try{ e.dataTransfer.setData('text/plain', DRAG); e.dataTransfer.effectAllowed = 'move'; }catch(err){}
      el.classList.add('dragging');
    };
    el.ondragend = ()=>{ DRAG = null; el.classList.remove('dragging'); b.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); };
  });
  b.querySelectorAll('[data-drop]').forEach(el=>{
    el.ondragover = (e)=>{
      if(!DRAG) return;
      const [dsi] = DRAG.split(':');
      if(el.dataset.drop.split(':')[0] !== dsi) return;    // 다른 세션으로는 못 옮긴다
      e.preventDefault();
      try{ e.dataTransfer.dropEffect = 'move'; }catch(err){}
      el.classList.add('over');
    };
    el.ondragleave = ()=> el.classList.remove('over');
    el.ondrop = (e)=>{
      e.preventDefault();
      el.classList.remove('over');
      const src = DRAG || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
      DRAG = null;
      if(!src) return;
      const i1 = src.indexOf(':'), i2 = src.indexOf(':', i1+1);
      const si = +src.slice(0,i1), from = +src.slice(i1+1,i2), nm = src.slice(i2+1);
      const [tsi, tto] = el.dataset.drop.split(':').map(Number);
      if(tsi !== si || tto === from) return;
      const s = S.sessions[si];
      const sizes = teamSizes(attendees(s).length, s);
      const pinnedThere = Object.keys(s.pin||{}).filter(k=>s.pin[k]===tto).length;
      if(pinnedThere >= sizes[tto]){
        toast((tto+1)+'조는 이미 '+pinnedThere+'명이 고정돼 자리가 없습니다');
        return;
      }
      act(()=>{ if(!s.pin) s.pin = {}; s.pin[nm] = tto; });
      toast(nm + ' 을 ' + (tto+1) + '조에 고정했습니다');
    };
  });
}

  // 같은 값이면 다른 방으로 둘 열들
  h += '<div class="card pad noprint" style="margin-top:14px">'
    +  '<div class="row" style="margin-bottom:6px"><span class="lbl">같은 값이면 다른 방</span>'
    +  '<span class="note">눌러서 켭니다. 소속·설계팀처럼 이미 아는 사이가 되는 열을 고르세요.</span></div>'
    +  '<div class="who">'
    +  attrCols().map(ci=>{
         const on = (R.guardNames||[]).indexOf(S.headers[ci]) >= 0;
         return '<button class="mini'+(on?' sel':'')+'" data-guard="'+esc(S.headers[ci])+'">'
              + esc(S.headers[ci]) + '</button>';
       }).join('')
    +  '</div>'
    +  '<div class="note" style="margin-top:6px">이미 만난 사이는 늘 피합니다 — 따로 켤 것이 없습니다.</div>'
    +  '</div>';

  // 짝 세 가지 — 몸짓은 같다: 묶음을 만들고 이름을 누른다
  const LISTS = [
    { k:'fixed',  t:'같은 방으로 묶기', n:'성별을 따지지 않습니다. 반드시 이대로 갑니다.', add:'묶음 만들기' },
    { k:'avoid',  t:'같은 방 안 됨',    n:'한 묶음에 넣은 사람끼리는 서로 다른 방으로 갑니다.', add:'묶음 만들기' },
    { k:'prefer', t:'되도록 같은 방',   n:'가능하면 붙여 줍니다. 성별이 다르면 안 됩니다.',   add:'묶음 만들기' }
  ];
  for(const L of LISTS){
    const list = R[L.k] || (R[L.k] = []);
    h += '<div class="card pad noprint" style="margin-top:14px">'
      +  '<div class="row" style="margin-bottom:6px"><span class="lbl">'+L.t+'</span>'
      +  '<span class="note">'+L.n+'</span>'
      +  '<span class="sp" style="flex:1"></span>'
      +  '<button class="btn sm" data-ppadd="'+L.k+'">'+L.add+'</button></div>';
    if(!list.length){
      h += '<div class="note">아직 없습니다.</div>';
    } else {
      const taken = new Set();
      if(L.k==='fixed') list.forEach(r=>r.forEach(n=>taken.add(n)));
      list.forEach((grp, ri)=>{
        h += '<div class="fixroom"><span class="pill">'+(ri+1)+'</span><div class="who">'
          +  activeNames().map(n=>{
               const inThis = grp.indexOf(n)>=0;
               const inOther = !inThis && taken.has(n);
               return '<button class="mini'+(inThis?' sel':'')+(inOther?' dim':'')
                    + '" data-pp="'+L.k+':'+ri+':'+esc(n)+'">'+esc(n)+'</button>';
             }).join('')
          +  '</div><button class="btn sm warn" data-ppdel="'+L.k+':'+ri+'">지우기</button></div>';
      });

    h += '</div>';

  // 결과
  if(R.list && R.list.length){
    const byG = new Map();
    R.list.forEach((r,idx)=>{
      const k = r.fixed ? '같은 방으로 묶기' : r.gender;
      if(!byG.has(k)) byG.set(k, []);
      byG.get(k).push(Object.assign({ idx }, r));
    });
    h += '<div style="margin-top:16px">';
    for(const [g, list] of byG){
      h += '<div class="row" style="margin:12px 0 7px"><h3 style="font-family:var(--myeongjo);font-weight:400;font-size:17px">'
        +  esc(g)+'</h3><span class="pill"><span class="v">'+list.length+'</span>개 방</span></div><div class="teams">';
      for(const r of list){
        h += '<div class="team"><h4>'

    }
    h += '</div>';
  }
  b.innerHTML = h;

  $('r-odd').onchange = (e)=> act(()=>{ R.odd = e.target.value; });
  $('r-party').onchange = (e)=> act(()=>{ R.allowParty = e.target.checked; });
  $('r-count').onchange = (e)=> act(()=>{ R.count = e.target.checked; });

    });
  });
  b.querySelectorAll('[data-guard]').forEach(el=>{
    el.onclick = ()=> act(()=>{
      const h2 = el.dataset.guard;
