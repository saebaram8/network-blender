      const p = R.guardNames.indexOf(h2);
      if(p>=0) R.guardNames.splice(p,1); else R.guardNames.push(h2);
    });
  });
  b.querySelectorAll('[data-ppadd]').forEach(el=>{
    el.onclick = ()=> act(()=>{ const k = el.dataset.ppadd; (R[k] = R[k]||[]).push([]); });
  });
  b.querySelectorAll('[data-pp]').forEach(el=>{
    el.onclick = ()=> act(()=>{
      const d = el.dataset.pp;
      const i1 = d.indexOf(':'), i2 = d.indexOf(':', i1+1);
      const k = d.slice(0,i1), ri = +d.slice(i1+1,i2), n = d.slice(i2+1);
      const list = R[k];
      // 강제 편성은 한 사람이 두 묶음에 들 수 없다 (방이 하나뿐이라)
      if(k==='fixed') list.forEach((g,x)=>{ const p = g.indexOf(n); if(p>=0 && x!==ri) g.splice(p,1); });
      const grp = list[ri], p = grp.indexOf(n);
      if(p>=0) grp.splice(p,1); else grp.push(n);
    });
  });
  b.querySelectorAll('[data-ppdel]').forEach(el=>{
    el.onclick = ()=> act(()=>{
      const d = el.dataset.ppdel, q = d.indexOf(':');
      R[d.slice(0,q)].splice(+d.slice(q+1), 1);
    });
  });
}

/* ── 5 진단 ── */
function renderDiag(){
  const b = $('diag-body');
  if(!PEOPLE.length){ b.innerHTML = '<div class="empty">명단을 먼저 넣습니다.</div>'; return; }
  const d = diagnose();
  if(!d.n){ b.innerHTML = '<div class="empty">참석자가 없습니다.</div>'; return; }

  const dv = d.distinct.map(x=>x.v).sort((a,b)=>a-b);
  const ch = d.chance.reduce((a,x)=>a+x.v,0);
  const su = d.distinct.reduce((a,x)=>a+x.v,0);
  const eff = ch ? Math.round(su/ch*100) : 0;
  const lo = dv[0]||0, hi = dv[dv.length-1]||0, mid = dv[Math.floor(dv.length/2)]||0;
  const cover = d.pairs ? Math.round(d.met/d.pairs*100) : 0;

  const cls = (v,g,w)=> v>=g?'good':(v>=w?'warn':'bad');
  let h = '<div class="stats">'
    + stat('겹치지 않은 정도', eff+'<small>%</small>', '같은 조에 앉은 '+ch+'자리 가운데 새 사람이 '+su, cls(eff,95,85))
    + stat('한 사람이 만난 수', mid+'<small>명</small>', '가장 적은 사람 '+lo+'명 · 가장 많은 사람 '+hi+'명', cls(lo?Math.round(lo/hi*100):0,80,60))
    + stat('서로 아는 사이', cover+'<small>%</small>', d.met+'쌍 / 전체 '+d.pairs+'쌍', cls(cover,45,25))
    + stat('두 번 이상 만난 쌍', d.dup2+'<small>쌍</small>', d.dup3?('그 가운데 세 번 이상 '+d.dup3+'쌍'):'세 번 이상은 없습니다', d.dup2===0?'good':(d.dup3===0?'warn':'bad'))
    + '</div>';

  if(d.violations.length){
    h += '<div class="warnbox" style="margin-top:14px"><b>지켜지지 않은 것</b><br>'
      +  d.violations.map(v=>esc(v)).join('<br>') + '</div>';
  } else {
    h += '<div class="okbox" style="margin-top:14px">일행이 같은 조에 든 곳도, 방에 성별이 섞인 곳도 없습니다.</div>';
  }
  if((d.roomMet && d.roomMet.length) || (d.roomMissed && d.roomMissed.length)){
    h += '<div class="warnbox" style="margin-top:10px; border-left-color:var(--gold); background:var(--gold-soft)">'
      +  (d.roomMet && d.roomMet.length
          ? '<b>같은 방인데 이미 만난 사이</b> ' + d.roomMet.length + '쌍 — '
            + d.roomMet.slice(0,6).map(esc).join(', ') + (d.roomMet.length>6?' 외':'')
            + '<br><span class="note">방이 모자라 피할 수 없었습니다. 조 크기를 바꾸거나 세션 배정을 다시 섞어 보세요.</span>'
          : '')
      +  (d.roomMissed && d.roomMissed.length
          ? (d.roomMet && d.roomMet.length ? '<br>' : '')
            + '<b>되도록 같은 방을 못 지킨 짝</b> ' + d.roomMissed.length + '쌍 — '
            + d.roomMissed.slice(0,6).map(esc).join(', ')
            + '<br><span class="note">성별이 다르거나 다른 약속과 부딪혔습니다. 꼭 붙이려면 같은 방으로 묶기를 쓰세요.</span>'
          : '')
      +  '</div>';
  }

  // 세션별 균형
  h += '<div class="card pad" style="margin-top:16px"><div class="lbl" style="margin-bottom:8px">세션마다 조건이 얼마나 고르게 나뉘었나</div>'
    +  '<div class="scrollx"><table class="tbl"><thead><tr><th>세션</th><th class="n">조</th>'
    +  attrCols().map(ci=>'<th>'+esc(S.headers[ci])+'</th>').join('') + '</tr></thead><tbody>';
  for(const s of d.sessions){
    h += '<tr><td>'+esc(s.name)+'</td><td class="n">'+s.teams+'</td>';
    for(const a of s.attrs){
      const ok = a.dev < 0.75, mid2 = a.dev < 1.5;
      const p = a.level ? (ok?'ok':(mid2?'warn':'bad')) : '';
      h += '<td>' + (a.level===0 && !a.tilted
            ? '<span class="note">—</span>'
            : '<span class="pill '+p+'">'+(a.mode==='cluster'?'모음':'')+(a.tilted?'조 크기 ':'')
              +'<span class="v">±'+a.dev.toFixed(1)+'</span></span>')
        + '</td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table></div><div class="note" style="margin-top:8px">'
    +  '±는 어느 조에서 가장 크게 벗어났는지입니다. 1 미만이면 나눌 수 있는 만큼 나뉜 것입니다.</div></div>';

  // 사람별
  const sorted = d.distinct.slice().sort((a,b)=>a.v-b.v);
  const chMap = new Map(d.chance.map(x=>[x.name,x.v]));
  h += '<div class="card pad" style="margin-top:16px"><div class="lbl" style="margin-bottom:8px">사람마다 몇 명을 만났나 <span class="note">— 적은 순</span></div>'
    +  '<div class="scrollx"><table class="tbl"><thead><tr><th>이름</th><th class="n">만난 사람</th>'
    +  '<th class="n">같은 조 자리</th><th class="n">겹침</th></tr></thead><tbody>'
    +  sorted.map(x=>{
         const c = chMap.get(x.name)||0;
         return '<tr><td>'+esc(x.name)+'</td><td class="n">'+x.v+'</td><td class="n">'+c+'</td><td class="n">'+(c-x.v)+'</td></tr>';
       }).join('')
    +  '</tbody></table></div></div>';

  // 만남 행렬
  const act = activeNames();
  if(act.length && act.length<=60){
    h += '<div class="card pad" style="margin-top:16px">'
      +  '<div class="row" style="margin-bottom:8px"><span class="lbl">누가 누구를 만났나</span>'
      +  '<span class="sp" style="flex:1"></span>'
      +  '<span class="note" id="hm-read">칸에 손을 올리면 누구와 몇 번인지 나옵니다</span></div>'
      +  '<div class="hmwrap"><table class="hm"><thead><tr><th></th>'
      +  act.map((n,c)=>'<th class="colh" data-c="'+c+'">'+esc(n)+'</th>').join('')
      +  '</tr></thead><tbody>';
    act.forEach((a,r)=>{
      h += '<tr><th class="rowh" data-r="'+r+'">'+esc(a)+'</th>';
      act.forEach((bb,c)=>{
        if(a===bb){ h += '<td class="hme"></td>'; return; }
        const v = MEET[PIDX.get(a)*NP + PIDX.get(bb)];
        const k = v>=3?'h3':(v===2?'h2':(v===1?'h1':'h0'));
        h += '<td class="cell '+k+'" data-r="'+r+'" data-c="'+c+'" data-v="'+v+'"'
          +  ' title="'+esc(a)+' · '+esc(bb)+' — '+v+'번"></td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>'
      +  '<div class="balbar" style="margin-top:8px">'
      +  '<span class="pill"><span class="sw h0"></span>안 만남 <span class="v">&nbsp;'+(d.pairs-d.met)+'</span>쌍</span>'
      +  '<span class="pill"><span class="sw h1"></span>1번 <span class="v">&nbsp;'+(d.met-d.dup2)+'</span>쌍</span>'
      +  '<span class="pill"><span class="sw h2"></span>2번 <span class="v">&nbsp;'+(d.dup2-d.dup3)+'</span>쌍</span>'
      +  '<span class="pill"><span class="sw h3"></span>3번 이상 <span class="v">&nbsp;'+d.dup3+'</span>쌍</span>'
      +  '</div></div>';
  }
  b.innerHTML = h;
  wireHeatmap(b, act);
}

/* 행렬은 이름이 바깥에만 있어 눈으로 줄을 따라가기 어렵다.
   손이 올라간 칸의 가로·세로를 함께 밝히고, 누구와 몇 번인지 글로도 말해준다. */
function wireHeatmap(b, act){
  const tbl = b.querySelector('table.hm');
  const read = b.querySelector('#hm-read');
  if(!tbl || !read) return;
  const idle = read.textContent;
  let lastR = -1, lastC = -1;
  const clear = ()=>{
    tbl.querySelectorAll('.xh').forEach(x=>x.classList.remove('xh'));
    lastR = lastC = -1;
  };
  tbl.addEventListener('mousemove', (e)=>{
    const td = e.target.closest ? e.target.closest('td.cell') : null;
    if(!td){ return; }
    const r = +td.dataset.r, c = +td.dataset.c;
    if(r===lastR && c===lastC) return;
    clear(); lastR = r; lastC = c;
    tbl.querySelectorAll('[data-r="'+r+'"],[data-c="'+c+'"]').forEach(x=>x.classList.add('xh'));
    const v = +td.dataset.v;
    read.textContent = act[r] + ' · ' + act[c] + ' — ' + (v ? v+'번 같은 조' : '아직 안 만남');
  });
  tbl.addEventListener('mouseleave', ()=>{ clear(); read.textContent = idle; });
}
function stat(k, v, d, cls){
  return '<div class="stat '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="d">'+esc(d)+'</div></div>';
}

/* ═══ 내보내기 ═══ */
function resultTSV(){
  /* 배치만 낸다. 일행·성별·조건 같은 속내는 넣지 않는다 —
     내보낸 표는 사람들에게 보여줄 것이라 필요한 것은 어디로 가는지뿐이다.
     방이 강제로 묶인 것인지도 드러내지 않는다. */
  const roomOf = new Map();
  if(S.rooms.list) S.rooms.list.forEach((r,i)=> r.who.forEach(n=> roomOf.set(n, roomLabel(i))));
  const live = PEOPLE.filter(p=>!S.out[p.name]);
  const out = [];

  // ① 사람마다 어디로 가나
  const head = ['이름'];
  for(const s of S.sessions) head.push(s.name);
  if(roomOf.size) head.push('숙박');
  out.push(head.join('\t'));
  for(const p of live){
    const row = [p.name];
    for(const s of S.sessions){
      let t = '불참';
      if(s.teams) s.teams.forEach((g,i)=>{ if(g.indexOf(p.name)>=0) t = (i+1)+'조'; });
      row.push(t);
    }
    if(roomOf.size) row.push(roomOf.get(p.name) || '');
    out.push(row.join('\t'));
  }

  // ② 세션마다 누가 모이나
  for(const s of S.sessions){
    if(!s.teams || !s.teams.length) continue;
    out.push('');
    out.push(s.name);
    s.teams.forEach((g,i)=> out.push((i+1)+'조\t'+g.length+'명\t'+sortNames(g).join(', ')));
  }
  if(S.rooms.list && S.rooms.list.length){
    out.push('');
    out.push('숙박');
    S.rooms.list.forEach((r,i)=> out.push(roomLabel(i)+'\t'+r.who.length+'명\t'+sortNames(r.who).join(', ')));
  }
  return out.join('\n');
}
function copyText(t, msg){
  const done = ()=> toast(msg);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, ()=>fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('복사하지 못했습니다'); }
    document.body.removeChild(ta);
  }
}

/* ═══ 예시 명단 ═══ */
const DEMO_F = ['서연','지우','하은','수아','지아','유나','시은','예린','다인','채원','소율','민서'];
const DEMO_M = ['도윤','시우','지호','준우','건우','현우','우진','정우','민준','예준','서준','유준','태현','승현','지훈','재윤','성민','동현'];
function demoRoster(){
  const r = rng(4242);
  const rows = [['이름','성별','소속','일행','개발경험','사전교육']];
  const orgs = ['가온','나루','다솜','라온','마루','한별'];
  const push = (nm, g)=> rows.push([nm, g, orgs[ri(r,orgs.length)], '',
      r()<0.45?'있음':'없음', r()<0.7?'수료':'미수료']);
  DEMO_M.slice(0,17).forEach(n=>push(n,'남'));
  DEMO_F.slice(0,12).forEach(n=>push(n,'여'));
  // 일행 몇 쌍
  rows[1][3]='A'; rows[2][3]='A';
  rows[18][3]='B'; rows[19][3]='B';
  rows[5][3]='C'; rows[20][3]='C'; rows[6][3]='C';
  return rows.map(x=>x.join('\t')).join('\n');
}

/* ═══ 온라인 저장 ═══
   claude.ai 아티팩트로 열었을 때만 켜진다. 파일로 열면 아무 일도 없다.
   페이지가 제 소스를 다시 받아 상태 덩이만 갈아끼우고 새 판으로 올린다.
   올리면 열려 있는 모든 창이 새 판으로 새로고침되므로 — 사람이 누를 때만 한다. */
let ARTIFACT = null, ONLINE = null;
const STATE_RE = /<script id="mixer-state"[^>]*>[\s\S]*?<\/script>/;

function readOnlineState(){
  try{
    const el = document.getElementById('mixer-state');
    if(!el || !el.textContent.trim()) return null;
    const o = JSON.parse(el.textContent);
    return (o && o.v) ? o : null;
  }catch(e){ return null; }
}
async function initCloud(){
  try{
    if(typeof claude === 'undefined' || !claude.use) return;
    ARTIFACT = await claude.use('artifact');
  }catch(e){ ARTIFACT = null; }
  const btn = $('b-cloud');
  if(btn && ARTIFACT) btn.style.display = '';
  render();
}
async function saveOnline(){
  if(!ARTIFACT){ toast('온라인 저장은 claude.ai 에서 열었을 때만 됩니다'); return; }
  toast('올리는 중입니다…');
  try{
    const res = await fetch(location.href, { cache:'no-store' });
    if(!res.ok) throw new Error('소스를 못 받았습니다 ('+res.status+')');
    let html = await res.text();
    S.savedAt = new Date().toISOString().slice(0,16).replace('T',' ');
    const json = JSON.stringify(stripDerived(S)).replace(/</g, '\\u003c');
    const block = '<script id="mixer-state" type="application/json">' + json + '<' + '/script>';
    if(STATE_RE.test(html)) html = html.replace(STATE_RE, block);
    else if(/<\/head>/i.test(html)) html = html.replace(/<\/head>/i, block + '</head>');
    else html = html.replace(/<body[^>]*>/i, m => m + block);
    save();
    const r = await ARTIFACT.publish(html);
    if(r && r.status === 'conflict') toast('다른 창에서 먼저 저장했습니다 — 그쪽 판으로 새로고침됩니다');
    else toast('온라인에 저장했습니다');
  }catch(e){
    toast('온라인 저장에 실패했습니다 — ' + (e && e.message ? e.message : '알 수 없는 까닭'));
  }
}

/* ═══ 시작 ═══ */
function boot(){
  ONLINE = readOnlineState();
  const had = load();
  // 이 브라우저에 아무것도 없으면 온라인 저장본으로 시작한다
  if(!had && ONLINE){
    S = Object.assign(blankState(), ONLINE);
    S.rooms = Object.assign(blankState().rooms, ONLINE.rooms || {});
    setTimeout(()=>toast('온라인 저장본을 불러왔습니다'), 300);
  }
  else if(!had){ S = blankState(); }
  if(!S.sessions.length && S.rows.length) seedSessions();
  buildPeople();
  pruneBias();      // 죽은 유·불리 키를 걷어낸다
  prunePins();
  autoDefaults();   // 아직 손대지 않은 조건에는 기본값이 들어온다
  showPaste = !PEOPLE.length;
  recompute(); render();

  $('b-shuffle').onclick = ()=>{
    if(!PEOPLE.length){ toast('명단이 없습니다'); return; }
    const kept = S.sessions.filter(s=>s.locked).length;
    act(()=>{
      for(const s of S.sessions) if(!s.locked) s.seed = Math.floor(Math.random()*1e6);
      S.rooms.seed = Math.floor(Math.random()*1e6);
    });
    toast(kept ? ('다시 섞었습니다 — 확정한 '+kept+'개는 그대로 둡니다') : '전부 다시 섞었습니다');
  };
  $('b-cloud').onclick = saveOnline;
  $('b-undo').onclick = undo;
  $('b-print').onclick = ()=> window.print();
  $('b-copy').onclick = ()=>{
    if(!PEOPLE.length){ toast('명단이 없습니다'); return; }
    copyText(resultTSV(), '시트에 붙여넣을 수 있게 복사했습니다');
  };
  $('b-backup').onclick = ()=>{
    copyText(JSON.stringify(stripDerived(S)), '설정을 복사했습니다 — 다른 기기에 붙여넣으면 그대로 옮겨집니다');
  };
  $('b-reshow').onclick = ()=>{ showPaste = true; render();
    const ta = $('ta-sheet'); if(ta){ ta.focus(); ta.scrollIntoView({block:'center', behavior:'smooth'}); } };
  $('b-demo').onclick = ()=> takeTable(demoRoster());
  $('b-addsess').onclick = ()=> act(()=>{ S.sessions.push(newSession('세션 '+(S.sessions.length+1))); });

  // 어디서든 붙여넣으면 받는다 — JSON 이면 설정, 표면 명단
  document.addEventListener('paste', (e)=>{
    const t = e.target;
    if(t && (t.tagName==='TEXTAREA' || t.tagName==='INPUT')) return;
    const txt = (e.clipboardData || window.clipboardData).getData('text');
    if(!txt || !txt.trim()) return;
    e.preventDefault();
    const s = txt.trim();
    if(s[0]==='{'){
      try{
        const o = JSON.parse(s);
        if(o && o.v){
          act(()=>{ S = Object.assign(blankState(), o); S.rooms = Object.assign(blankState().rooms, o.rooms||{}); });
          showPaste = false; render(); toast('설정을 되살렸습니다'); return;
        }
      }catch(err){}
    }
    takeTable(txt);
  });

  document.addEventListener('keydown', (e)=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.shiftKey){
      const t = e.target;
      if(t && (t.tagName==='TEXTAREA' || t.tagName==='INPUT')) return;
      e.preventDefault(); undo();
    }
  });

  // 레일이 지금 어디를 보고 있는지 알려준다
  const links = Array.prototype.slice.call(document.querySelectorAll('#rail a'));
  const secs = links.map(a=>document.querySelector(a.getAttribute('href')));
  const io = new IntersectionObserver((ents)=>{
    ents.forEach(en=>{
      if(!en.isIntersecting) return;
      const i = secs.indexOf(en.target);
      links.forEach((a,k)=>a.classList.toggle('on', k===i));
    });
  }, { rootMargin:'-70px 0px -60% 0px' });
  secs.forEach(s=>{ if(s) io.observe(s); });
  initCloud();
}

/* check.js 가 속을 들여다볼 수 있게 열어둔다 — 브라우저에서는 쓰지 않는다 */
globalThis.__CHECK__ = {
  get S(){ return S; }, set S(v){ S = v; },
  get PEOPLE(){ return PEOPLE; },
  get PIDX(){ return PIDX; },
  get MEET(){ return MEET; },
  get NP(){ return NP; },
  get LASTMS(){ return LASTMS; },
  blankState, newSession, seedSessions, takeTable, recompute, diagnose,
  attendees, teamSizes, attrCols, valOf, activeNames, demoRoster,
  parseTable, resultTSV, computeRooms, roomPool, pairSizes,
  autoDefaults, biasOf, hasBias, colValues, buildPeople
};
boot();
</script>
